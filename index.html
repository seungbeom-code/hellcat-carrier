<!doctype html>
<html lang="ko">

<title>헬캣 착함 대작전 — 1단계 시제품</title>
<style>

<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="rot">폰을 가로로 돌려 주세요</div>
<script>
'use strict';
// ───────── 상수 (단위: m, m/s) ─────────
const W = 960, H = 540, KT = 1.944;
const GRAV = 9.8, KL = 0.004375, KD0 = 0.000276, AMAX = 10, PWR = 2500;   // 바퀴·플랩은 모양일 뿐, 비행에는 영향이 없다 (항상 같은 날개·항력)
const CL_MAX = 1.17, CL_BASE = 0.35;   // 실속 속도 약 85노트 (그 아래에서는 날개가 양력을 못 낸다)
const SHIP_V = 11;                 // 갑판 맞바람 30노트
const DECK_Y = 20, DECK_L = 260, WH = 3.2;   // 갑판 높이, 길이, 바퀴 밑까지 거리
const ZONE_L = DECK_L * 0.3, ZONE_A = 20, ZONE_B = ZONE_A + ZONE_L;   // 어레스팅 와이어 구역 (갑판의 30%, 가운데)
const WIRES = [0, 1, 2, 3].map(i => ZONE_A + 10 + i * (ZONE_L - 20) / 3);
const TURN_T = 1.6;   // 선회에 걸리는 시간(초)
const HOOK_BACK = 7.5, CRUISE_KT = 270, SLOW_KT = 105;   // 후크 끝 위치, 손을 뗐을 때 순항 속도, 항모 근처 접근 속도
const TAKEOFF_KT = 100, TURN_KT = 100;   // 이륙과 선회에 필요한 최소 속도
const LAND_KT = 125, LAND_SINK = 8, LAND_PITCH = 0.22;   // 착함 허용 한계: 속도, 가라앉는 속도, 기울기
const TD = 53, SLOPE = 0.065, CUT_X = -4;    // 접지 목표, 활공 기울기, 컷 신호 위치
const START_XR = 156, LAUNCH_XR = 156, UTURN_XR = -650;   // 발진선
const ELEV_A = 118, ELEV_W = 24, ELEV_C = ELEV_A + ELEV_W / 2, ELEV_DEPTH = 14, TAXI_V = 13;   // 가운데 엘리베이터
const LOADS = [   // 기획서의 출격 장비 네 가지
  { name: '제공', fuel: 160, accel: 1.0, ammo: '기관총 2,400발 + 보조 연료탱크', hud: '기관총 2400 · 보조탱크', lines: ['기관총 + 보조 탱크', '가벼움 · 연료 +60%', '공중전 · 함대 방어'] },
  { name: '로켓', fuel: 100, accel: 0.93, ammo: '기관총 2,400발 + 로켓 6발', hud: '기관총 2400 · 로켓 6', lines: ['기관총 + 로켓 6발', '무게 보통', '대공포 · 벙커 제거'] },
  { name: '폭격', fuel: 100, accel: 0.85, ammo: '기관총 2,400발 + 1,000파운드 폭탄 1발', hud: '기관총 2400 · 폭탄 1000', lines: ['기관총 + 1,000파운드', '폭탄 1발 · 무거움', '활주로 · 대형 군함'] },
  { name: '혼합', fuel: 100, accel: 0.78, ammo: '기관총 2,400발 + 500파운드 폭탄 2발 + 로켓 4발', hud: '기관총 · 폭탄 500×2 · 로켓 4', lines: ['500파운드 2 + 로켓 4', '매우 무거움', '여러 표적 동시에'] }
];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ───────── 상태 ─────────
const ship = { x: 0, v: SHIP_V };
const cam = { x: 0, y: 60, z: 3 };
const G = { t: 0, stickers: [], result: null, assist: true, lso: null, lsoT: 0, flag: 0, loadout: 1, toast: null, scene: 'menu', holdX: 1e9, sel: 0, mi: 0, m: null, lives: 3, carrierHp: 100, land: null, dark: 0, res: null, menuMsg: '', save: loadSave() };
let p;
function reset() {
  p = { mode: 'taxi', x: 0, y: DECK_Y + WH, vx: SHIP_V, vy: 0, th: 0, a: 0.035, s: 1, in: 0, thr: 0,
        gear: true, flaps: true, hook: false, gunT: 0, rkT: 0, bmT: 0, ammo: { ...LOAD_AMMO[G.loadout] }, fuel: LOADS[G.loadout].fuel, fuelMax: LOADS[G.loadout].fuel, hp: 100, lock: 0, flip: 0, flipFrom: 1, pushT: 0, el: null, xr: START_XR, vr: 0, held: true, flagT: 0,
        landing: false, wire: -1, turn: 0, go: false, off: false, liftT: 0, wx: null, eng: false, ld: 1, relT: 0, engT: 0, tookOff: false, prevY: DECK_Y + WH,
        ap: { maxErr: 0, maxSpd: 0, on: false }, td: null };
  p.x = ship.x + p.xr;
  G.result = null; G.lso = null; G.msg = null; G.burn = null; G.toast = null; FX.length = 0; PROJ.length = 0; EB.length = 0;
}
const kts = () => Math.hypot(p.vx, p.vy) * KT;

// ───────── 비행 물리 ─────────
function aero(V, alpha) {
  let CL = 5 * alpha + p.s * CL_BASE;
  CL = clamp(CL, -CL_MAX, CL_MAX);
  const q = KL * V * V;
  const kd = KD0;
  const thr = p.fuel > 0 ? p.thr : 0;
  return { aL: q * CL, aD: kd * V * V + q * CL * CL * 0.06, aT: thr * Math.min(AMAX, PWR / Math.max(V, 1)) };
}
function stallKt() { return Math.sqrt(GRAV / (KL * CL_MAX)) * KT; }

function airStep(dt) {
  p.prevY = p.y;
  let V = Math.hypot(p.vx, p.vy) || 0.01;
  if (p.off) {                            // 갑판에서 떨어지는 중: 조종 불가
    p.vy -= 11 * dt; p.vx *= 1 - 0.4 * dt; p.th += -p.s * 0.9 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; return;
  }
  if (p.turn > 0) {                       // 선회: 출력이 줄어 속도와 고도를 조금 잃는다
    p.turn -= dt;
    const f = clamp(1 - p.turn / TURN_T, 0, 1);
    p.vx = p.v0 * Math.cos(Math.PI * f) * lerp(1, 0.85, f);
    p.vy += (-6 - p.vy) * Math.min(1, 2.5 * dt);
    if (f >= 0.5 && !p.flipped) { p.s = -p.s; p.a = -p.a; p.flipped = true; }
    p.th = p.s > 0 ? -0.06 : Math.PI + 0.06;
    if (p.turn <= 0) { p.vx = -p.v0 * 0.85; p.turn = 0; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    return;
  }
  const g = Math.atan2(p.vy, p.vx);
  if (p.s * Math.cos(g) < -0.3 && Math.abs(p.in) < 0.2) { p.s = -p.s; p.a = -p.a; }   // 뒤집힌 채 놓으면 바로 선다
  const aTrim = clamp((GRAV * 0.985 / (KL * V * V) - CL_BASE) / 5, -0.25, 0.25);   // 키를 안 눌러도 속도에 맞춰 수평에 가깝게 맞춰 준다
  const pg = clamp(Math.pow(60 / V, 1.6), 0.3, 2.0);                                  // 빠를수록 같은 입력에 덜 꺾이게 해서 조작감을 같게 한다
  const aCmd = p.s * (aTrim + p.in * (p.in > 0 ? 0.2 : 0.14) * pg);
  p.a += (aCmd - p.a) * Math.min(1, dt * 28);
  p.th = g + p.a;
  const f = aero(V, p.a), ux = p.vx / V, uy = p.vy / V;
  p.vx += (f.aT * Math.cos(p.th) - f.aD * ux - f.aL * uy) * dt;
  p.vy += (f.aT * Math.sin(p.th) - f.aD * uy + f.aL * ux - GRAV) * dt;
  if (p.neutral) {   // 손을 뗀 상태: 흔들림 없이 천천히 내려가고 속도도 안정된다
    const xr = p.x - ship.x, over = xr > 0 && xr < DECK_L && p.y - WH - DECK_Y < 22;   // 갑판 위에 들어서면 조금 더 빨리 내려앉는다
    p.vy += ((over ? -5 : -2.5) - p.vy) * Math.min(1, (over ? 6 : 4) * dt);
    const farC = Math.abs(p.x - ship.x - DECK_L / 2), kV = Math.max(clamp((p.y - 45) / 90, 0, 1), clamp((farC - 500) / 700, 0, 1));   // 항모에서 멀거나 높으면 빠르게, 항모 근처에서 낮게 날 때만 천천히
    const Vt = lerp(SLOW_KT, CRUISE_KT, kV) / KT;   // 손을 떼면 낮을수록 천천히 난다 (바퀴와는 무관)
    p.vx += Math.sign(p.vx) * clamp((Vt - V) * 1.6, -12, 9) * dt;
  }
  p.x += p.vx * dt; p.y += p.vy * dt;
}
// 수평선에 대한 기수 각도 (어느 쪽을 보고 날든 같은 기준)
function levelPitch() { const a = p.s > 0 ? p.th : Math.PI - p.th; return Math.atan2(Math.sin(a), Math.cos(a)); }

function tailSit(V) { return 0.2 * clamp(1 - (V * KT - 34) / 30, 0, 1); }   // 느릴 때는 꼬리바퀴로 앉고, 빨라지면 꼬리가 들린다
function deckStep(dt) {
  if (p.landing) {                        // 착함 뒤: 후크가 와이어를 잡아 급히 멈춘다 (어느 방향이든)
    const d = p.ld, hookX = p.xr - d * HOOK_BACK;
    if (!p.eng && p.wx !== null && (hookX - p.wx) * d >= 0) {   // 후크가 와이어를 걸었다
      p.eng = true; p.engT = G.t; sfx('wire');
      for (let i = 0; i < 16; i++) FX.push({ k: 'spark', x: ship.x + hookX, y: DECK_Y + 0.4, vx: ship.v - d * (4 + Math.random() * 16), vy: 4 + Math.random() * 11, life: 0.35 + Math.random() * 0.35, t: 0 });
    }
    let dec;
    if (p.wx === null) dec = 6;   // 걸 와이어가 없다: 바퀴 제동뿐이라 갑판 끝에서 떨어지기 쉽다
    else if (p.eng) {   // 와이어가 걸렸다: 남은 갑판 안에서 세워 준다
      const room = (d > 0 ? DECK_L - p.xr : p.xr) - 8;
      dec = Math.max(34, p.vr * p.vr / (2 * clamp(room, 6, 40)));
    } else dec = Math.min(5, p.vr * p.vr / (2 * ((p.wx - hookX) * d + 4)));   // 와이어에 닿기 전: 바퀴만 굴러간다
    p.vr -= d * dec * dt; if (p.vr * d <= 0) p.vr = 0;
    p.xr += p.vr * dt;
    const tail = tailSit(Math.abs(p.vr + ship.v));
    p.th = p.s > 0 ? tail : Math.PI - tail;
    p.x = ship.x + p.xr; p.y = DECK_Y + WH; p.vx = p.vr + ship.v; p.vy = 0;
    if (p.xr < -3 || p.xr > DECK_L + 3) { p.mode = 'air'; p.landing = false; p.vy = -3; p.off = true; p.offWhy = p.wx === null ? '와이어 구역을 지나쳐 갑판 끝에서 떨어졌다. 노란 줄무늬 구역 앞쪽에 내려야 한다.' : '갑판이 모자라 바다로 떨어졌다. 갑판 가운데쯤에 내려야 한다.'; return; }   // 갑판이 모자라 떨어진다
    if (p.vr === 0) finish();
    return;
  }
  const V = p.vr + ship.v;
  if (p.held) {
    p.vr = 0; p.th = tailSit(ship.v);
    if (p.thr > 0.8) { p.flagT += dt; if (p.flagT > 0.8) { p.held = false; sfx('flag'); } } else p.flagT = 0;
  } else {
    const alpha = 0.035 + Math.max(0, p.in) * 0.19;
    const f = aero(V, alpha);
    let acc = f.aT * 1.55 * LOADS[G.loadout].accel - f.aD - 0.4;
    if (p.thr < 0.1) acc -= 4;
    p.vr = Math.max(0, p.vr + acc * dt);
    p.th = tailSit(V) + Math.max(0, p.in) * 0.12;
    if (V * KT >= TAKEOFF_KT && p.in > 0.3) {   // 속도가 붙은 뒤 기수를 들어야 뜬다
      p.mode = 'air'; p.vx = V; p.vy = 0.6; p.a = alpha; p.tookOff = true; p.liftT = G.t;
      p.y = DECK_Y + WH + 0.05; p.x = ship.x + p.xr; return;
    }
  }
  p.xr += p.vr * dt;
  p.x = ship.x + p.xr; p.y = DECK_Y + WH; p.vx = p.vr + ship.v; p.vy = 0;
  if (p.xr > DECK_L + 1) { p.mode = 'air'; p.a = 0.035; p.vy = -2; p.off = true; p.offWhy = '이륙 속도가 모자라 갑판 끝에서 떨어졌다.'; }
}

// ───────── 신호장교: 갑판에 다가올 때 속도·강하·수평을 알려 준다 ─────────
function lsoSignal() {
  if (p.mode !== 'air' || p.turn > 0 || !p.tookOff) return null;
  const xr = p.x - ship.x;
  if (xr < -520 || xr > DECK_L + 520 || p.y > DECK_Y + WH + 80 || p.vy > 0.5) return null;
  if (!((p.vx > 0 && xr < DECK_L) || (p.vx < 0 && xr > 0))) return null;
  if (kts() > LAND_KT * 0.94) return 'FAST';
  if (p.vy < -LAND_SINK * 0.75) return 'LOW';
  if (Math.abs(levelPitch()) > LAND_PITCH * 0.75) return 'HIGH';
  return 'ROGER';
}
const LSO_TEXT = { ROGER: '좋음 — 그대로', FAST: '빠름 — 손을 뗀다', LOW: '너무 급하다 — ▲', HIGH: '수평을 맞춘다' };

// ───────── 접지, 충돌, 판정 ─────────
function crash(why, ditch) {
  G.lives--; if (G.m) G.m.crashes++;
  sfx(ditch ? 'splash' : 'crash'); p.mode = 'down';
  const sea = p.y <= 3;
  G.result = { kind: ditch ? 'ditch' : 'crash', why, at: G.t, sea };
  if (!ditch) boom(p.x, Math.max(p.y, 1), p.vx, p.vy, sea);
}
// 파편, 불꽃, 연기
const FX = [];
function boom(x, y, vx, vy, sea) {
  ['wing', 'wing', 'tail', 'cowl', 'body', 'body', 'wheel', 'wheel', 'bit', 'bit', 'bit', 'bit', 'bit'].forEach(k => FX.push({ k, deb: true, x, y: y + 1,
    vx: vx * 0.45 + (Math.random() - 0.5) * 34, vy: 7 + Math.random() * 17, r: Math.random() * 6, vr: (Math.random() - 0.5) * 14, life: 9, t: 0 }));
  for (let i = 0; i < 18; i++) FX.push({ k: 'fire', x: x + (Math.random() - 0.5) * 9, y: y + Math.random() * 3, vx: vx * 0.3 + (Math.random() - 0.5) * 14, vy: 3 + Math.random() * 12, life: 0.7 + Math.random() * 1.0, t: 0, s: 2 + Math.random() * 3.5 });
  FX.push({ k: 'flash', x, y, vx: 0, vy: 0, life: 0.28, t: 0 });
  G.burn = sea ? null : { xr: x - ship.x, y, until: G.t + 7, next: 0 };
}
function stepFx(dt) {
  if (G.burn && G.t < G.burn.until && G.t >= G.burn.next) {   // 잔해에서 연기와 불이 계속 오른다
    G.burn.next = G.t + 0.07; const bx = ship.x + G.burn.xr + (Math.random() - 0.5) * 6;
    FX.push({ k: Math.random() < 0.35 ? 'fire' : 'smoke', x: bx, y: G.burn.y + Math.random() * 2, vx: ship.v - 4 + Math.random() * 3, vy: 5 + Math.random() * 5, life: 1.4 + Math.random(), t: 0, s: 2 + Math.random() * 3 });
  }
  for (let i = FX.length - 1; i >= 0; i--) {
    const q = FX[i]; q.t += dt; q.life -= dt;
    if (q.deb) {
      if (!q.rest) {
        q.vy -= GRAV * 1.3 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.r += q.vr * dt;
        const xr = q.x - ship.x;
        if (xr > -2 && xr < DECK_L + 2 && q.y <= DECK_Y + 0.6 && q.y > DECK_Y - 4 && q.vy < 0) {   // 갑판에 튕긴다
          q.y = DECK_Y + 0.6; q.vy = -q.vy * 0.35; q.vx = ship.v + (q.vx - ship.v) * 0.55; q.vr *= 0.5;
          if (q.vy < 2) { q.rest = true; q.xr = xr; }
        } else if (q.y <= 0) { q.life = 0; FX.push({ k: 'splash', x: q.x, y: 0, vx: 0, vy: 0, life: 0.6, t: 0 }); }
      } else q.x = ship.x + q.xr;
    } else { if (q.k === 'spark') q.vy -= 32 * dt; else if (q.k === 'dirt') q.vy -= 26 * dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.k !== 'spark' && q.k !== 'dirt') q.vx += (ship.v * 0.3 - q.vx) * dt; }
    if (q.life <= 0) FX.splice(i, 1);
  }
}
function drawFx() {
  const c = ctx;
  for (const q of FX) {
    if (q.deb) { world(q.x, q.y, () => {
      c.rotate(q.r);
      if (q.k === 'wing') { c.fillStyle = '#27466a'; c.beginPath(); c.moveTo(-5, -0.5); c.lineTo(5, -0.3); c.lineTo(4, 0.5); c.lineTo(-4.2, 0.9); c.closePath(); c.fill(); c.fillStyle = '#f4f6f8'; c.beginPath(); c.arc(1, 0.1, 0.5, 0, 7); c.fill(); }
      else if (q.k === 'tail') { c.fillStyle = '#24405f'; c.beginPath(); c.moveTo(-1.5, -1.6); c.lineTo(2, -1.6); c.lineTo(-0.6, 2.4); c.lineTo(-1.6, 2.4); c.closePath(); c.fill(); }
      else if (q.k === 'cowl') { c.fillStyle = '#1d3552'; c.beginPath(); c.arc(0, 0, 2, 0, 7); c.fill(); c.fillStyle = '#333'; c.fillRect(-0.2, -3.2, 0.4, 6.4); }
      else if (q.k === 'body') { c.fillStyle = '#2f4f74'; c.beginPath(); c.moveTo(-3.4, -1.6); c.lineTo(2.6, -2); c.lineTo(3.6, 0.4); c.lineTo(1.8, 0); c.lineTo(2.8, 1.9); c.lineTo(-3, 1.5); c.closePath(); c.fill(); c.fillStyle = '#e9edf0'; c.fillRect(-3, -1.6, 5.4, 0.9); }
      else if (q.k === 'wheel') { c.fillStyle = '#222'; c.beginPath(); c.arc(0, 0, 0.75, 0, 7); c.fill(); }
      else { c.fillStyle = '#c9ced4'; c.fillRect(-0.6, -0.3, 1.2, 0.6); }
    }); continue; }
    const X = sx(q.x), Y = sy(q.y), k = clamp(q.t / (q.t + q.life), 0, 1);
    if (q.k === 'flash') { c.fillStyle = 'rgba(255,244,200,' + (1 - k) + ')'; c.beginPath(); c.arc(X, Y, (10 + k * 34) * cam.z, 0, 7); c.fill(); }

}

// 선회 중에는 기체를 간단한 입체 모형으로 그린다 (yaw: 수직축 회전, bank: 왼쪽 기울기)
function drawPlane3D(yaw, bank, gear) {
  const c = ctx, cy = Math.cos(yaw), sn = Math.sin(yaw), cb = Math.cos(-bank), sb = Math.sin(-bank);
  const T = (x, y, z) => { const y1 = y * cb - z * sb, z1 = y * sb + z * cb; return [x * cy + z1 * sn, y1, -x * sn + z1 * cy]; };
  const parts = [], dn = T(0, -1, 0), topSeen = dn[2] < 0;
  const poly = (pts, fill, edge) => { const q = pts.map(a => T(a[0], a[1], a[2])); parts.push({ d: q.reduce((t, a) => t + a[2], 0) / q.length, f: () => {
    c.beginPath(); q.forEach((a, i) => i ? c.lineTo(a[0], a[1]) : c.moveTo(a[0], a[1])); c.closePath(); c.fillStyle = fill; c.fill(); c.strokeStyle = edge || fill; c.lineWidth = 0.4; c.lineJoin = 'round'; c.stroke(); } }); };
  const ball = (x, y, r, col, belly, z) => { const a = T(x, y, z || 0); parts.push({ d: a[2], f: () => {
    c.fillStyle = col; c.beginPath(); c.arc(a[0], a[1], r, 0, 7); c.fill();
    if (belly) { const k = r * (0.95 - 0.8 * dn[2]); c.save(); c.clip(); c.fillStyle = '#e9edf0'; c.beginPath(); c.arc(a[0] + dn[0] * k, a[1] + dn[1] * k, r * 0.85, 0, 7); c.fill(); c.restore(); } } }); };
  const ring = (cx, cyy, cz, r, plane, fill) => { const pts = []; for (let i = 0; i < 14; i++) { const a = i / 14 * 6.283; pts.push(plane === 'yz' ? [cx, cyy + Math.cos(a) * r, cz + Math.sin(a) * r] : [cx + Math.cos(a) * r, cyy, cz + Math.sin(a) * r]); } poly(pts, fill); };
  const prof = [[-8.8, 0.9, 0.6], [-7.2, 0.8, 1.05], [-5.4, 0.6, 1.55], [-3.6, 0.4, 2.0], [-1.8, 0.3, 2.4], [0, 0.3, 2.65], [1.8, 0.2, 2.75], [3.6, 0.1, 2.65], [5.2, 0, 2.45]];
  for (let i = 0; i < prof.length - 1; i++) for (let k = 0; k < 4; k++) { const a = prof[i], b = prof[i + 1], u = k / 4; ball(lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u), '#2f4f74', true); }
  ball(6.9, 0, 2.15, '#1d3552'); ball(1.3, 2.3, 1.45, '#bfe3f2'); ball(8.9, 0, 0.6, '#c9ced4');
  const wingCol = topSeen ? '#27466a' : '#dfe5ea', wingEdge = topSeen ? '#1c3350' : '#b9c2cb';
  [1, -1].forEach(m => {
    poly([[3.4, -0.6, 0], [1.9, -0.4, 10.8 * m], [-0.5, -0.4, 10.8 * m], [-2.4, -0.6, 0]], wingCol, wingEdge);
    poly([[-6.4, 0.9, 0], [-7.3, 0.9, 4.2 * m], [-8.9, 0.9, 4.2 * m], [-9.4, 0.9, 0]], wingCol, wingEdge);
    if (topSeen) ring(0.5, -0.38, 7.4 * m, 1.3, 'xz', '#f4f6f8');
  });
  poly([[-6.2, 1.2, 0], [-9.3, 5.2, 0], [-10.2, 5.2, 0], [-9.6, 0.8, 0]], '#24405f');
  if (gear) {   // 내려와 있는 바퀴
    [2.7, -2.7].forEach(z => { poly([[1.6, -0.8, z], [2.1, -0.8, z], [2.5, -2.5, z], [2.1, -2.5, z]], '#9aa3ad'); ball(2.3, -2.5, 0.8, '#222', false, z); });
    ball(-7.6, -1.2, 0.42, '#222');
  }
  ring(9.1, 0, 0, 3.6, 'yz', 'rgba(230,235,240,0.38)');
  parts.sort((a, b) => a.d - b.d).forEach(q => q.f());
}

// 함교 날개 위의 신호장교: 신호에 따라 패들을 든다 (작게)
function lsoSmall(c) {
  const x = 160, y = DECK_Y + 12.65, sig = G.lso, t = G.t, PI = Math.PI;
  let L = PI * 1.42, R = -PI * 0.42;   // 신호가 없을 때는 팔을 내린다
  if (sig === 'ROGER') { L = PI; R = 0; }
  else if (sig === 'HIGH') { L = PI * 0.75; R = PI * 0.25; }
  else if (sig === 'LOW') { L = PI * 1.25; R = -PI * 0.25; }
  else if (sig === 'FAST') { L = PI * 1.4; R = -PI * 0.4 + Math.sin(t * 9) * 0.25; }
  c.fillStyle = '#e8ecf0'; c.fillRect(x - 0.55, y, 1.1, 1.9);
  c.fillStyle = '#f2c9a0'; c.beginPath(); c.arc(x, y + 2.45, 0.55, 0, 7); c.fill();
  c.fillStyle = '#d9a441'; c.beginPath(); c.arc(x, y + 2.6, 0.58, PI, 0); c.fill();
  [[L, -1], [R, 1]].forEach(([a, sd]) => {
    const ax = x + sd * 0.5, ay = y + 1.6, ex = ax + Math.cos(a) * 1.9, ey = ay + Math.sin(a) * 1.9;
    c.strokeStyle = '#e8ecf0'; c.lineWidth = 0.4; c.lineCap = 'round'; c.beginPath(); c.moveTo(ax, ay); c.lineTo(ex, ey); c.stroke(); c.lineCap = 'butt';
    c.fillStyle = '#ff5a3c'; c.beginPath(); c.arc(ex, ey, 0.6, 0, 7); c.fill();
  });
}

function drawWorld() {

function panel(x, y, w, h, a) { ctx.fillStyle = 'rgba(8,20,34,' + (a || 0.55) + ')'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill(); }

function drawLSO() {   // 신호장교 확대창
  const sig = G.lso; if (!sig) return;
  const c = ctx, x = 720, y = 58, w = 226, h = 122, t = G.t;
  const warn = sig === 'WAVEOFF', good = sig === 'ROGER' || sig === 'CUT';

  const cx = x + 52, cy = y + 66;
  let L = Math.PI, R = 0;   // 팔 각도 (왼팔, 오른팔)
  if (sig === 'HIGH') { L = Math.PI * 0.75; R = Math.PI * 0.25; }
  if (sig === 'LOW') { L = Math.PI * 1.25; R = -Math.PI * 0.25; }
  if (sig === 'FAST') { L = Math.PI * 1.4; R = -Math.PI * 0.4 + Math.sin(t * 9) * 0.25; }

  if (sig === 'CUT') { L = Math.PI * 1.3; R = Math.PI * 0.85; }
  if (sig === 'WAVEOFF') { const k = Math.sin(t * 12) * 0.5; L = Math.PI * 0.6 + k; R = Math.PI * 0.4 - k; }

  c.fillStyle = '#f2f4f6'; c.beginPath(); c.roundRect(cx - 9, cy - 8, 18, 34, 5); c.fill();
  c.fillStyle = '#f2c9a0'; c.beginPath(); c.arc(cx, cy - 20, 10, 0, 7); c.fill();
  c.fillStyle = '#d9a441'; c.beginPath(); c.arc(cx, cy - 23, 10, Math.PI, 0); c.fill();
  [[L, -1], [R, 1]].forEach(([a, sd]) => {
    const ax = cx + sd * 8, ay = cy - 2, ex = ax + Math.cos(a) * 26, ey = ay - Math.sin(a) * 26;
    c.strokeStyle = '#f2f4f6'; c.lineWidth = 6; c.lineCap = 'round'; c.beginPath(); c.moveTo(ax, ay); c.lineTo(ex, ey); c.stroke();

  c.font = '800 17px system-ui,sans-serif'; c.fillStyle = warn ? '#ff8a73' : good ? '#8df0a8' : '#ffe27a';

  if (parts[1]) { c.font = '600 13px system-ui,sans-serif'; c.fillStyle = '#fff'; c.fillText(parts[1], x + 108, y + 82); }
}

function hint() {
  if (G.result) return '';
  if (G.msg && G.t < G.msg.until) return G.msg.text;
  if (p.mode === 'taxi') {
    if (G.t < p.lock) return '';
    if (overElev()) return '스페이스바: 엘리베이터로 내려가기 (수리·재장전)';
    if (p.s > 0 && p.xr >= LAUNCH_XR - 0.5) return '▶ 를 꾹 누르면 발진 · 공중에서 Space 기관총, X 로켓, C 폭탄';
    return '◀ ▶ 로 갑판 위를 움직인다 · 가운데 엘리베이터에서 수리와 재장전 · 오른쪽 끝에서 발진';
  }
  if (p.mode === 'lift') return p.el && p.el.st === 'svc' ? '' : '엘리베이터 이동 중';
  const xr = p.x - ship.x;
  if (p.mode === 'deck' && !p.landing) {
    if (!p.go) return '▶ 를 누르면 발진';
    if (p.held) return '발진 신호를 기다린다…';
    return kts() >= TAKEOFF_KT ? '▲ 기수를 든다!' : '달리는 중… ' + TAKEOFF_KT + '노트가 되면 ▲';
  }
  if (p.mode === 'deck') return '';
  if (p.turn > 0) return '선회 중 — 속도와 고도가 조금 줄어든다';
  if (G.lso) return '';
  if (G.t - p.liftT < 5) return '▲ 로 상승한다';
  if (Math.abs(xr - 130) > 900) return '반대 방향 키로 선회해 항모로 돌아간다';
  return '손을 떼면 천천히 내려간다. 노란 줄무늬 어레스팅 구역에 수평으로 내려앉는다';
}

function drawMiniMap(c) {

  c.fillStyle = '#4f8a45';

  c.fillStyle = '#ff8a5c'; ENE.forEach(e => { if (!e.dead) c.fillRect(mx(e.x) - 1, base - clamp(e.y / 400, 0, 1) * (h - 7) - 3, 2, 2); });

}

  for (const d of DPAD) {
    c.fillStyle = ctl[d.k] ? 'rgba(255,210,63,0.85)' : 'rgba(8,20,34,0.42)'; c.beginPath(); c.roundRect(d.x, d.y, d.w, d.h, 14); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = 2; c.stroke();
    c.fillStyle = ctl[d.k] ? '#111' : '#fff'; c.font = '800 34px system-ui,sans-serif'; c.textAlign = 'center'; c.fillText(d.label, d.x + d.w / 2, d.y + d.h / 2 + 12);
  }
  for (const b of BTN) {
    c.fillStyle = 'rgba(26,60,110,0.85)'; c.beginPath(); c.roundRect(b.x, b.y, b.w, b.h, 9); c.fill();
    c.fillStyle = '#fff'; c.font = '800 13px system-ui,sans-serif'; c.textAlign = 'center';
    c.fillText(b.id === 'snd' ? (sound.muted ? '소리 끔' : '소리 켬') : b.label, b.x + b.w / 2, b.y + b.h / 2 + 5);
  }
  if (overElev()) {   // 엘리베이터 버튼
    const b = ELEV_BTN; c.fillStyle = 'rgba(26,90,150,0.92)'; c.beginPath(); c.roundRect(b.x, b.y, b.w, b.h, 12); c.fill(); c.strokeStyle = '#9fd0ff'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#fff'; c.font = '800 17px system-ui,sans-serif'; c.textAlign = 'center'; c.fillText('엘리베이터로 내려가기 (Space)', b.x + b.w / 2, b.y + 34);
  }
  if (G.toast && G.t < G.toast.until) {   // 착함 결과
    const col = { green: '#59d37a', yellow: '#ffd23f', brown: '#a9793f' }[G.toast.grade] || '#fff';
    c.font = '800 16px system-ui,sans-serif'; const tw = c.measureText(G.toast.text).width;
    panel(480 - tw / 2 - 34, 138, tw + 68, 32, 0.8); c.fillStyle = col; c.beginPath(); c.arc(480 - tw / 2 - 14, 154, 8, 0, 7); c.fill();
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.fillText(G.toast.text, 488, 160);
  }
  if (landBtnOn()) { const b = LANDBTN; c.fillStyle = 'rgba(40,120,70,0.94)'; c.beginPath(); c.roundRect(b.x, b.y, b.w, b.h, 12); c.fill(); c.strokeStyle = '#9ef0b8'; c.lineWidth = 2; c.stroke(); c.fillStyle = '#fff'; c.font = '800 17px system-ui,sans-serif'; c.textAlign = 'center'; c.fillText('상륙 개시 (V)', b.x + b.w / 2, b.y + 32); }
  if (p.mode === 'air') FIRE.forEach(b => {   // 발사 버튼
    const n = b.k === 'gun' ? p.ammo.gun : b.k === 'rocket' ? p.ammo.rk : p.ammo.bm, held = b.k === 'gun' && (keys.Space || keys.KeyZ || touch.on.gun > 0);
    c.fillStyle = held ? 'rgba(230,90,60,0.95)' : n > 0 ? 'rgba(150,40,30,0.88)' : 'rgba(60,66,76,0.8)'; c.beginPath(); c.roundRect(b.x, b.y, b.w, b.h, 12); c.fill();
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.font = '800 15px system-ui,sans-serif'; c.fillText(b.label, b.x + b.w / 2, b.y + 26); c.font = '600 12px system-ui,sans-serif'; c.fillText(n + '  (' + b.key + ')', b.x + b.w / 2, b.y + 46);
  });
  if (hangarOpen()) drawHangar(c);
  const hm = hint();
  if (hm) { c.font = '700 16px system-ui,sans-serif'; const tw = c.measureText(hm).width; panel(480 - tw / 2 - 14, 96, tw + 28, 34, 0.7); c.fillStyle = '#fff'; c.textAlign = 'center'; c.fillText(hm, 480, 119); }
  // 결과
  if (G.result && (G.result.kind !== 'crash' || G.t - G.result.at > 2.6)) {
    const r = G.result; panel(250, 150, 460, 250, 0.86); c.textAlign = 'center';
    const col = { green: '#59d37a', yellow: '#ffd23f', brown: '#a9793f', red: '#ff5a3c', barrier: '#8a94a0' };
    const name = { green: '완벽', yellow: '양호', brown: '미흡', red: '위험', barrier: '방벽' };
    if (r.kind === 'land') {
      c.fillStyle = col[r.grade]; c.beginPath(); c.arc(480, 215, 38, 0, 7); c.fill();
      c.fillStyle = '#111'; c.font = '800 20px system-ui,sans-serif'; c.fillText(name[r.grade], 480, 222);
      c.fillStyle = '#fff'; c.font = '700 18px system-ui,sans-serif'; c.fillText(r.note, 480, 290);
      c.font = '600 14px system-ui,sans-serif'; c.fillStyle = '#c9d4de'; c.fillText('접지 속도 ' + r.kt + '노트', 480, 318);
    } else {
      c.fillStyle = '#fff'; c.font = '800 26px system-ui,sans-serif'; c.fillText(r.kind === 'ditch' ? '불시착수' : '추락', 480, 225);
      c.font = '700 16px system-ui,sans-serif'; c.fillText(r.why, 480, 282);
    }
    c.fillStyle = '#ffd23f'; c.font = '800 16px system-ui,sans-serif'; c.fillText(G.lives > 0 ? '여기를 누르면 다시 이륙 (Enter) · 남은 항공기 ' + G.lives : '항공기를 모두 잃었다 (Enter)', 480, 368);
  }
}

function updateCam(dt) {
  const xr = p.x - ship.x, near = Math.abs(xr - 130) < 900 && p.y < 260;
  let zt = p.mode === 'deck' || p.mode === 'taxi' || p.mode === 'lift' || (p.mode === 'down' && !G.result.sea) ? 2.9 : near ? 2.1 : 1.6;
  zt = Math.max(0.15, Math.min(zt, 0.5 * H / Math.max(p.y, 40)));   // 높이 올라가면 지평선(바다)이 항상 보이도록 축소
  cam.z = lerp(cam.z, zt, Math.min(1, dt * (zt < cam.z ? 6 : 1.5)));
  const dir = p.vx >= 0 ? 1 : -1;
  const tx = p.x + dir * (0.2 + clamp((kts() - 120) / 900, 0, 0.12)) * W / cam.z, ty = Math.max(p.y * 0.92, H * 0.27 / cam.z);
  cam.x = lerp(cam.x, tx, Math.min(1, dt * 5)); cam.y = lerp(cam.y, ty, Math.min(1, dt * 6)); cam.y = Math.min(cam.y, 0.4 * H / cam.z);   // 바다가 화면 밖으로 나가지 않게
}

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

let last = 0, acc = 0;
const STEP = 1 / 120;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  if (!G.paused) {
    readKeys(dt); acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    updateCam(dt);
  }
  updateSound(dt);
  const shake = p.mode === 'deck' && !p.landing && p.thr > 0.7 ? 1.6 : 0;
  ctx.save(); if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawWorld(); ctx.restore(); if (G.scene === 'play') drawHUD(); else drawScene();
  requestAnimationFrame(frame);
}
reset(); cam.x = p.x; cam.y = 60;
requestAnimationFrame(frame);
</script>
