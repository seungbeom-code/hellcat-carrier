<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="rot">Please turn your phone sideways</div>
<script>
'use strict';
// ───────── 상수 (단위: m, m/s) ─────────
const W = 960, H = 540, KT = 1.944;
const GRAV = 9.8, KL = 0.004375, KD0 = 0.000276, AMAX = 10, PWR = 2500;   // 바퀴·플랩은 모양일 뿐, 비행에는 영향이 없다 (항상 같은 날개·항력)
const CL_MAX = 1.17, CL_BASE = 0.35;   // 실속 속도 약 85노트 (그 아래에서는 날개가 양력을 못 낸다)
const SHIP_V = 11;                 // 갑판 맞바람 30노트
const DECK_Y = 20, DECK_L = 520, WH = 3.2, CS = DECK_L / 260, ISL_DX = 124;   // 갑판 길이는 예전의 2배 (선체 그림은 가로로 2배로 늘이고, 함교는 그대로 두고 자리만 옮긴다)   // 갑판 높이, 길이, 바퀴 밑까지 거리
const ZONE_B = 196, ZONE_A = 85, ZONE_L = ZONE_B - ZONE_A;   // 어레스팅 와이어 구역: 와이어 3개 (예전 4개에서 선미 쪽 하나를 줄여 함 중앙 쪽으로 좁혔다)
const WIRES = [0, 1, 2].map(i => ZONE_A + 10 + i * (ZONE_L - 20) / 2);
const TURN_T = 3.2;   // 선회에 걸리는 시간(초): 예전의 2배라 회전 반경도 2배
const HOOK_BACK = 7.5, CRUISE_KT = 270, SLOW_KT = 200;   // 후크 끝 위치, 손을 뗐을 때 순항 속도, 항모 근처 접근 속도
const MIN_KT = 200;   // 날고 있을 때(바퀴를 올린 상태) 속도는 이 아래로 떨어지지 않는다. 방향 전환 중에도 마찬가지
const TAKEOFF_KT = 100, TURN_KT = 100;   // 이륙과 선회에 필요한 최소 속도
const LAND_KT = 215, LAND_SINK = 8, LAND_PITCH = 0.22;   // 착함 허용 한계: 속도, 가라앉는 속도, 기울기
const MAX_ALT = 600;   // 최고 고도: 나도 적기도 이 위로는 못 올라간다
const CEIL = 500;   // 지도에서 고도를 그리는 기준(m). 실제 고도 제한은 없고 높이 올라가면 실속한다
const SINK_T = 18, SINK_DEPTH = 74;   // 항모가 가라앉는 데 걸리는 시간(초), 마지막에 함교 꼭대기까지 잠기는 깊이
const sinkProg = () => G.sink ? clamp((G.t - G.sink.t0) / SINK_T, 0, 1) : 0;
const MAX_LVL = 20;   // 마지막 레벨
const CARRIER_MIN = 1500;   // 항모 중심에서 가장 가까운 섬·적함까지 최소 거리(m)
const START_XR = 312, LAUNCH_XR = 312;   // 발진선
const FM_X = 292;   // 신호수의 고정 자리: 관제탑(함교) 오른쪽
const ELEV_A = 236, ELEV_W = 24, ELEV_C = ELEV_A + ELEV_W / 2, ELEV_DEPTH = 14, TAXI_V = 13, ELEV_R = 16;
const APP_R = DECK_L / 2 + 370;   // 항모 가운데에서 이 거리 안이면 '항모 근처' (갑판 끝에서 370m)   // 가운데 엘리베이터
const LOADS = [   // 무장: 기관총 2400발에 로켓·폭탄·어뢰 중 하나 (엘리베이터 아래에서 고른다)
  { name: 'Rockets', fuel: 100, accel: 1.0, ammo: '15 heavy rockets', use: 'Bunkers, AA guns, ship guns', key: 'C' },
  { name: 'Bombs', fuel: 100, accel: 0.92, ammo: '30 small bombs (250 kg)', use: 'Buildings, barracks, parked aircraft', key: 'C' },
  { name: 'Torpedoes', fuel: 100, accel: 0.9, ammo: '2 torpedoes', use: 'Sinking ships', key: 'C' }
];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ───────── 상태 ─────────
const ship = { x: 0, v: SHIP_V };
const cam = { x: 0, y: 60, z: 3 };
const G = { t: 0, stickers: [], result: null, assist: true, lso: null, lsoT: 0, flag: 0, loadout: 0, toast: null, scene: 'menu', holdX: 1e9, sel: 0, mi: 0, m: null, lives: 3, carrierHp: 100, land: null, dark: 0, res: null, menuMsg: '', save: loadSave() };
let p;
function reset() {
  p = { mode: 'taxi', x: 0, y: DECK_Y + WH, vx: SHIP_V, vy: 0, th: 0, a: 0.035, s: 1, in: 0, thr: 0,
        gear: true, flaps: true, hook: false, turnPend: false, stalled: false, slowTurn: false, gunT: 0, rkT: 0, bmT: 0, ammo: { ...LOAD_AMMO[G.loadout] }, fuel: LOADS[G.loadout].fuel, fuelMax: LOADS[G.loadout].fuel, hp: 100, lock: 0, flip: 0, flipFrom: 1, pushT: 0, el: null, xr: START_XR, vr: 0, held: true, flagT: 0,
        landing: false, wire: -1, turn: 0, go: false, off: false, liftT: 0, wx: null, eng: false, ld: 1, relT: 0, engT: 0, tookOff: false, prevY: DECK_Y + WH,
        ap: { maxErr: 0, maxSpd: 0, on: false }, td: null };
  p.x = ship.x + p.xr;
  G.result = null; G.lso = null; G.msg = null; G.burn = null; G.toast = null; FX.length = 0; PROJ.length = 0; EB.length = 0;
}
const kts = () => (p.turn > 0 ? Math.max(Math.hypot(p.vx, p.vy), Math.abs(p.v0 || 0) * lerp(1, 0.85, clamp(1 - p.turn / TURN_T, 0, 1)), p.gear ? 0 : MIN_KT / KT) : Math.hypot(p.vx, p.vy)) * KT;   // 선회 중에는 경로를 따라 나는 속도

// ───────── 비행 물리 ─────────
function aero(V, alpha) {
  let CL = 5 * alpha + p.s * CL_BASE;
  CL = clamp(CL, -CL_MAX, CL_MAX);
  const q = KL * V * V;
  const kd = KD0;
  const thr = p.fuel > 0 ? p.thr : 0, dn = airDen();   // 높이 올라갈수록 공기가 희박해 엔진 힘과 날개 양력이 줄어든다
  return { aL: q * CL * (0.25 + 0.75 * dn), aD: kd * V * V + q * CL * CL * 0.06, aT: thr * dn * Math.min(AMAX, PWR / Math.max(V, 1)) };
}
function airDenAt(y) { return clamp(1 - Math.max(0, y - 250) / 400, 0.1, 1); }
function airDen() { return airDenAt(p.y); }
function stallKt() { return Math.sqrt(GRAV / (KL * CL_MAX * (0.25 + 0.75 * airDen()))) * KT; }   // 높이 올라갈수록 실속 속도가 올라간다

function liftLoss() {   // 속도가 느릴수록 양력이 모자란다: 실속 속도의 1.6배부터 서서히 늘어 실속 속도에서 1
  const st = stallKt(), full = st * 1.6, k = kts(); return clamp((full - k) / (full - st), 0, 1);
}
function airStep(dt) {
  p.prevY = p.y;
  let V = Math.hypot(p.vx, p.vy) || 0.01;
  if (p.turnPend) p.in = 0;   // 선회 대기 중에는 ▲▼ 를 받지 않는다
  if (p.off) {                            // 갑판에서 떨어지는 중: 조종 불가
    p.vy -= 11 * dt; p.vx *= 1 - 0.4 * dt; p.th += -p.s * 0.9 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; return;
  }
  if (p.turn > 0) {                       // 선회: 출력이 줄어 속도와 고도를 조금 잃는다
    p.turn -= dt;
    const f = clamp(1 - p.turn / TURN_T, 0, 1);
    p.vx = Math.sign(p.v0) * Math.max(Math.abs(p.v0) * lerp(1, 0.85, f), p.gear ? 0 : MIN_KT / KT) * Math.cos(Math.PI * f);
    p.vy += (-3 - p.vy) * Math.min(1, 2.5 * dt);
    if (f >= 0.5 && !p.flipped) { p.s = -p.s; p.a = -p.a; p.flipped = true; }
    p.th = p.s > 0 ? -0.06 : Math.PI + 0.06;
    if (p.turn <= 0) { p.vx = -Math.sign(p.v0) * Math.max(Math.abs(p.v0) * 0.85, p.gear ? 0 : MIN_KT / KT); p.turn = 0; p.turnEndT = G.t; p.holdG = null; if (p.slowTurn) { p.stalled = true; p.slowTurn = false; G.msg = { text: 'Stalled by turning too slowly! Falling until you gain speed', until: G.t + 2.5 }; sfx('stall'); } }
    p.x += p.vx * dt; p.y = Math.min(MAX_ALT, p.y + p.vy * dt);
    return;
  }
  const g = Math.atan2(p.vy, p.vx);
  if (p.s * Math.cos(g) < -0.3 && Math.abs(p.in) < 0.2) { p.s = -p.s; p.a = -p.a; }   // 뒤집힌 채 놓으면 바로 선다
  const aTrim = clamp((GRAV * 0.985 / (KL * V * V) - CL_BASE) / 5, -0.25, 0.25);   // 키를 안 눌러도 속도에 맞춰 수평에 가깝게 맞춰 준다
  const pg = clamp(Math.pow(60 / V, 1.6), 0.3, 2.0);                                  // 빠를수록 같은 입력에 덜 꺾이게 해서 조작감을 같게 한다
  let aCmd = p.s * (aTrim + p.in * (p.in > 0 ? 0.3 : 0.24) * pg);
  const recov = Math.max(TURN_KT + 20, stallKt() * 1.35);   // 이만큼 속도가 붙어야 실속에서 벗어난다
  const climbA = Math.atan2(p.vy, Math.abs(p.vx));
  if (!p.stalled && climbA > Math.PI / 3) { p.stalled = true; G.msg = { text: 'Climbed too steeply and stalled! The nose drops', until: G.t + 2.5 }; sfx('stall'); }   // 60도 넘게 오르면 실속
  if (p.stalled && V * KT >= recov && climbA < 0.35) { p.stalled = false; G.msg = { text: 'Speed regained, out of the stall', until: G.t + 1.8 }; }
  if (p.stalled || V * KT < stallKt()) { aCmd = p.s * -0.12; p.vy -= 6 * dt; }   // 실속: 조종이 듣지 않고 기수가 떨어진다
  p.a += (aCmd - p.a) * Math.min(1, dt * 9);
  p.th = g + p.a;
  const f = aero(V, p.a), ux = p.vx / V, uy = p.vy / V;
  p.vx += (f.aT * Math.cos(p.th) - f.aD * ux - f.aL * uy) * dt;
  p.vy += (f.aT * Math.sin(p.th) - f.aD * uy + f.aL * ux - GRAV) * dt;
  const lossD = liftLoss(); if (lossD > 0 && !p.stalled) p.vy -= 5.5 * lossD * lossD * dt * 1.0 + 1.2 * lossD * dt;   // 느리면 양력이 모자라 서서히 가라앉는다
  if (p.neutral) {   // 손을 뗀 상태: 흔들림 없이 천천히 내려가고 속도도 안정된다
    // 손을 뗀 상태: 항모 근처든 아니든 똑같이 난다 (갑판에 맞춰 주는 보정은 없다)
    const hold = p.holdG !== null && p.holdG !== undefined && G.t - p.liftT >= 5;
    if (hold && p.holdG > 0 && V * KT < stallKt() * 1.15) { p.holdG -= 0.3 * dt; if (p.holdG <= 0) p.holdG = null; }   // 너무 느려지면 기수가 서서히 내려간다
    let vt = G.t - p.liftT < 5 ? 3 : hold ? Math.tan(p.holdG) * Math.abs(p.vx) : -2.5;   // 오르거나 내려가던 중에 손을 떼면 그 방향 그대로 부드럽게 난다
    vt -= 4 * lossD;   // 느릴수록 더 빨리 가라앉는다
    if (p.stalled || V * KT < stallKt()) vt = Math.min(vt, -8);   // 실속: 가라앉는다
    p.vy += (vt - p.vy) * Math.min(1, 4 * dt);
    const kV = clamp((p.y - 45) / 90, 0, 1);   // 낮을수록 천천히, 높을수록 빠르게 (위치와는 상관없다)
    const Vt = (p.gear ? lerp(SLOW_KT, CRUISE_KT, kV) : Math.max(MIN_KT, lerp(SLOW_KT, CRUISE_KT, kV))) / KT;   // 손을 떼면 낮을수록 천천히 난다
    p.vx += Math.sign(p.vx) * clamp((Vt - V) * 1.6, -12, 9 * airDen()) * dt;
  }
  if (!p.gear) { const Vm = MIN_KT / KT, V1 = Math.hypot(p.vx, p.vy); if (V1 < Vm && V1 > 0.01) { const kk = 1 + Math.min(1, 12 * dt) * (Vm / V1 - 1); p.vx *= kk; p.vy *= kk; } }   // 바퀴를 올리고 날 때는 150kt 아래로 느려지지 않는다
  if (p.turnPend) {   // 선회 대기: 부드럽게 수평으로 돌아온 다음 선회한다
    p.vy += (0 - p.vy) * Math.min(1, 2.2 * dt);
    if (Math.abs(Math.atan2(p.vy, Math.abs(p.vx))) < 0.1) startTurn();
  }
  if (G.t - p.liftT < 4) p.vy = Math.min(p.vy, 1 + (G.t - p.liftT) * 3);
  if (p.y > MAX_ALT - 80 && p.vy > 0) { p.vy = Math.min(p.vy, Math.max(0, MAX_ALT - p.y) * 0.4); if (p.y > MAX_ALT - 15 && (!G.msg || G.msg.until < G.t)) G.msg = { text: 'Maximum altitude ' + MAX_ALT + ' m', until: G.t + 1.5 }; }   // 600m 가까이 가면 부드럽게 멈춘다
  if (p.y > 250 && kts() < stallKt() * 1.08 && (!G.toast || G.toast.until < G.t)) G.toast = { text: p.y > 420 ? 'Air too thin, stalling! Lower the nose and build speed' : 'Stalling! Lower the nose and build speed', grade: 'yellow', until: G.t + 2.5 };   // 고도 제한 대신 실속
  p.x += p.vx * dt; p.y += p.vy * dt;
}
// 수평선에 대한 기수 각도 (어느 쪽을 보고 날든 같은 기준)
function levelPitch() { const a = p.s > 0 ? p.th : Math.PI - p.th; return Math.atan2(Math.sin(a), Math.cos(a)); }

function tailSit(V) { return 0.2 * clamp(1 - (V * KT - 34) / 30, 0, 1); }   // 느릴 때는 꼬리바퀴로 앉고, 빨라지면 꼬리가 들린다
function deckStep(dt) {
  if (p.landing) {                        // 착함 뒤: 후크가 와이어를 잡아 급히 멈춘다 (어느 방향이든)
    const d = p.ld, hookX = p.xr - d * HOOK_BACK;
    if (!p.eng && p.wx !== null && (hookX - p.wx) * d >= 0) {   // 후크가 와이어를 걸었다
      p.eng = true; p.engT = G.t; sfx('wire');
      for (let i = 0; i < 16; i++) FX.push({ k: 'spark', x: ship.x + hookX, y: DECK_Y + 0.4, vx: ship.v - d * (4 + Math.random() * 16), vy: 4 + Math.random() * 11, life: 0.35 + Math.random() * 0.35, t: 0 });
    }
    let dec;
    if (p.wx === null) dec = 6;   // 걸 와이어가 없다: 바퀴 제동뿐이라 갑판 끝에서 떨어지기 쉽다
    else if (p.eng) {   // 와이어가 걸렸다: 남은 갑판 안에서 세워 준다
      const room = (d > 0 ? DECK_L - p.xr : p.xr) - 8;
      dec = Math.max(34, p.vr * p.vr / (2 * clamp(room, 6, 40)));
    } else dec = Math.min(5, p.vr * p.vr / (2 * ((p.wx - hookX) * d + 4)));   // 와이어에 닿기 전: 바퀴만 굴러간다
    p.vr -= d * dec * dt; if (p.vr * d <= 0) p.vr = 0;
    p.xr += p.vr * dt;
    const tail = tailSit(Math.abs(p.vr + ship.v));
    p.th = p.s > 0 ? tail : Math.PI - tail;
    p.x = ship.x + p.xr; p.y = DECK_Y + WH; p.vx = p.vr + ship.v; p.vy = 0;
    if (p.xr < -3 || p.xr > DECK_L + 3) { p.mode = 'air'; p.landing = false; p.vy = -3; p.off = true; p.offWhy = p.wx === null ? 'Overshot the wires and rolled off the deck. Touch down at the front of the yellow striped zone.' : 'Ran out of deck and fell into the sea. Touch down near the middle of the deck.'; return; }   // 갑판이 모자라 떨어진다
    if (p.vr === 0) finish();
    return;
  }
  // 이륙 활주: ◀·▶ 어느 쪽이든 바라보는 방향 키를 누르고 있으면 점점 빨라지고, 꼬리가 들리고, 갑판 끝에서 뜬다
  const d = p.s > 0 ? 1 : -1, V = Math.abs(p.vr + ship.v), fwdK = d > 0 ? ctl.right : ctl.left, backK = d > 0 ? ctl.left : ctl.right;
  p.rollT = fwdK ? (p.rollT || 0) + dt : 0;
  {
    const f = aero(V, 0.035 + Math.max(0, p.in) * 0.19);
    let acc = (f.aT * 1.55 * LOADS[G.loadout].accel - f.aD - 0.4) * clamp(0.3 + p.rollT / 2.5, 0.3, 1);   // 처음엔 천천히, 누르고 있을수록 힘차게
    if (!fwdK) acc = -4;    // 키를 놓으면 천천히 선다
    if (backK) acc = -12;   // 반대 키: 브레이크
    const sp = Math.max(0, p.vr * d + acc * dt); p.vr = sp * d;
    if (backK ? sp <= 0 : sp < TAXI_V && !fwdK) { p.mode = 'taxi'; p.go = false; p.lock = 0; if (backK) p.vr = 0; }   // 반대 키로 완전히 멈추면(돌아설 차례) 또는 손을 떼고 느려지면 갑판 이동으로
    const tail = tailSit(V) + Math.max(0, p.in) * 0.12; p.th = d > 0 ? tail : Math.PI - tail;   // 빨라지면 꼬리가 들린다
  }
  p.xr += p.vr * dt;
  p.x = ship.x + p.xr; p.y = DECK_Y + WH; p.vx = p.vr + ship.v; p.vy = 0;
  if (p.xr > DECK_L + 1 || p.xr < -1) {   // 갑판 끝: 속도가 충분하면 떠오르고, 모자라면 떨어진다
    const V2 = p.vr + ship.v;
    if (Math.abs(V2) * KT >= TAKEOFF_KT && Math.sign(V2) === d) { p.mode = 'air'; p.vx = V2; p.vy = 0.5; p.a = 0.06 * d; p.tookOff = true; p.liftT = G.t; p.y = DECK_Y + WH + 0.05; p.x = ship.x + p.xr; p.turnPend = false; p.stalled = false; p.slowTurn = false; }
    else { p.mode = 'air'; p.a = 0.035; p.vy = -2; p.off = true; p.offWhy = 'Not enough takeoff speed, dropped off the end of the deck.'; }
  }
}

// ───────── 신호장교: 갑판에 다가올 때 속도·강하·수평을 알려 준다 ─────────
function lsoSignal() {

function update(dt) {

  if (G.scene === 'title') demoBot(dt);   // 첫 화면: 자동 조종 데모
  G.t += dt; if (ship.x < G.holdX) ship.x += ship.v * dt;   // 섬에 너무 가까워지면 항모는 그 자리에 머문다
  if (!G.manual) autoFly(dt); p.flaps = p.gear;
  if (p.mode === 'deck') deckStep(dt);
  else if (p.mode === 'air') { airStep(dt); checkContact(); }
  else if (p.mode === 'taxi') taxiStep(dt);
  else if (p.mode === 'lift') liftStep(dt);
  else if (p.mode === 'fall' || p.mode === 'slide') crashStep(dt);
  else if (p.mode === 'dslide') dslideStep(dt);
  else if (p.mode === 'down' && G.result && G.result.kind === 'wreck' && G.result.deck) { p.x = ship.x + p.xr; p.y = DECK_Y + WH - 0.4; p.vx = ship.v; }   // 갑판 위 잔해는 배와 함께 간다
  else if (p.mode === 'down') { p.y = Math.max(1, p.y - 6 * dt); p.x += p.vx * dt; p.vx *= 1 - Math.min(1, 2 * dt); }
  if (p.mode === 'air' || (p.mode === 'deck' && !p.held)) p.fuel = Math.max(0, p.fuel - (0.03 + 0.25 * p.thr) * dt);
  G.lso = lsoSignal(); fireStep(dt); stepProj(dt); missionStep(dt); enemyStep(dt); ebStep(dt); flakStep(dt); shellStep(dt); quadStep(dt); towerStep(dt); shipMgStep(dt); stepFx(dt);
}

// 출력, 바퀴, 후크를 알아서 맞춘다
function autoFly(dt) {
  const fwd = p.s > 0 ? ctl.right : ctl.left;
  let tgt = 0;
  if (p.mode === 'deck') { if (!p.landing) { if (fwd) p.go = true; tgt = p.go ? 1 : 0.12; } }
  else if (p.mode === 'air') {
    if (p.turn > 0) tgt = 0.2;                 // 선회 중에는 출력이 줄어든다
    else if (fwd) tgt = 1;                     // 가는 방향 키: 출력 최대
    else if (ctl.up) tgt = 0.85;               // 올라갈 때는 출력을 보탠다
    else if (ctl.down) tgt = 0.1;
    else tgt = 0.25;
    const nn = p.turn <= 0 && !fwd && !ctl.up && !ctl.down;
    if (nn && !p.neutral && p.mode === 'air') { const gm = Math.atan2(p.vy, Math.abs(p.vx)); p.holdG = Math.abs(gm) > 0.05 && G.t - (p.turnEndT || -9) > 0.6 ? gm : null; }   // 선회 직후에는 기억하지 않는다   // 손을 뗀 순간의 비행 방향을 기억한다 (수평에 가까우면 예전처럼 천천히 내려간다)
    p.neutral = nn;
    const far = Math.abs(p.x - ship.x - DECK_L / 2);   // 바퀴는 항모 가까이에서 낮게 날 때만 내린다
    const since = G.t - p.liftT;   // 이륙한 지 몇 초째인가
    const climbed = since > 2.5 && since < 15 && p.y > DECK_Y + WH + 15;   // 이륙하고 어느 정도 날아오른 뒤에 바퀴를 접는다
    if (p.gear && (climbed || far > APP_R + 150 || p.y > 100)) { p.gear = false; sfx('clunk'); }
    if (!p.gear && since > 15 && far < APP_R && p.y < 80) { p.gear = true; sfx('clunk'); }   // 항모 주변(500m 안)에서 낮게 날 때만 내린다
  }
  if (p.mode !== 'air') p.neutral = false;
  p.thr += (tgt - p.thr) * Math.min(1, dt * 9);
  p.hook = p.gear && p.tookOff && G.t - p.liftT > 15;   // 이륙 직후에는 후크를 내리지 않는다 (착함하러 올 때만)
  if (p.mode === 'taxi' || p.mode === 'lift' || (p.mode === 'deck' && !p.landing)) p.hook = G.t < p.relT;   // 착함 뒤에는 후크를 들어 올린다
}

// 갑판 승무원: 장화·바지·색 저지·가죽 헬멧과 고글, 팔꿈치가 굽는 두 팔. 오른손에 빨간 깃발(또는 패들)
function deckCrew(c, x, y, aR, aL, item, cr, one) {   // cr: 웅크림 0(서 있음) ~ 1(무릎을 굽힘)

  const limb = (x0, y0, a, l1, l2, bend, col, w) => {   // 위팔·아래팔 두 마디
    const ex = x0 + Math.cos(a + bend) * l1, ey = y0 + Math.sin(a + bend) * l1, hx = ex + Math.cos(a - bend * 0.6) * l2, hy = ey + Math.sin(a - bend * 0.6) * l2;
    c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(x0, y0); c.lineTo(ex, ey); c.lineTo(hx, hy); c.stroke();
    c.fillStyle = '#e9bf94'; c.beginPath(); c.arc(hx, hy, w * 0.42, 0, 7); c.fill();
    return [hx, hy];
  };
  // 뒤쪽 팔 (어둡게)
  const [bh, bv] = limb(x - 0.12, sh, aL, 0.75, 0.7, 0.25, '#b8961f', 0.36);
  if (item === 'paddle') { c.fillStyle = '#d9662a'; c.beginPath(); c.arc(bh + Math.cos(aL) * 0.5, bv + Math.sin(aL) * 0.5, 0.5, 0, 7); c.fill(); }
  // 다리와 장화
  c.save(); c.translate(0, -dy);   // 다리는 땅에 붙어 있고, 웅크리면 무릎이 앞으로 나온다
  c.strokeStyle = '#6f6a52'; c.lineWidth = 0.42;
  if (one) {   // 한쪽 무릎만 굽힌 자세: 앞다리는 무릎을 굽혀 내딛고 뒷다리는 곧게 뒤로 뻗는다
    c.beginPath(); c.moveTo(x - 0.1, y + 1.55 + dy); c.lineTo(x - 0.28 - 0.25 * k, y + 0.8 - 0.1 * k); c.lineTo(x - 0.3 - 0.85 * k, y + 0.25); c.stroke();
    c.beginPath(); c.moveTo(x + 0.12, y + 1.55 + dy); c.lineTo(x + 0.35 + 0.8 * k, y + 0.85 + 0.1 * k); c.lineTo(x + 0.45 + 0.2 * k, y + 0.25); c.stroke();
  } else {

    c.beginPath(); c.moveTo(x + 0.12, y + 1.55 + dy); c.lineTo(x + 0.3 + 0.7 * k, y + 0.82 + 0.1 * k); c.lineTo(x + 0.36, y + 0.25); c.stroke();
  }
  c.fillStyle = '#2b2620'; c.fillRect(x - 0.52, y, 0.5, 0.3); c.fillRect(x + 0.18, y, 0.52, 0.3);
  c.restore();
  // 허리띠와 몸통(노란 저지, 등번호 띠)
  c.fillStyle = '#4a3b26'; c.fillRect(x - 0.36, y + 1.5, 0.74, 0.16);
  c.fillStyle = '#f2c230'; c.beginPath(); c.moveTo(x - 0.38, y + 1.64); c.lineTo(x - 0.44, sh + 0.05); c.quadraticCurveTo(x, sh + 0.32, x + 0.44, sh + 0.05); c.lineTo(x + 0.38, y + 1.64); c.closePath(); c.fill();
  c.fillStyle = 'rgba(0,0,0,0.13)'; c.fillRect(x - 0.4, y + 1.66, 0.22, sh - y - 1.66);
  c.fillStyle = '#1d1d1d'; c.fillRect(x - 0.3, y + 2.2, 0.6, 0.12);
  // 목·얼굴·가죽 헬멧과 고글
  c.fillStyle = '#e9bf94'; c.fillRect(x - 0.1, sh + 0.12, 0.2, 0.18);
  c.beginPath(); c.ellipse(x + 0.05, sh + 0.55, 0.27, 0.32, 0, 0, 7); c.fill();
  c.fillStyle = '#d4ad22'; c.beginPath(); c.ellipse(x - 0.01, sh + 0.66, 0.31, 0.27, 0, PI * 0.92, PI * 2.12); c.fill();
  c.fillRect(x - 0.3, sh + 0.32, 0.14, 0.34);   // 귀덮개
  c.fillStyle = '#3a3a3a'; c.fillRect(x - 0.05, sh + 0.66, 0.36, 0.11); c.fillStyle = '#9fc4d8'; c.fillRect(x + 0.14, sh + 0.64, 0.16, 0.13);
  // 앞쪽 팔과 든 물건

    const bx = hx + ca * 0.75, by = hy + sa * 0.75, nx = -sa, ny = ca, side = ny >= 0 ? -1 : 1, L = 1.25;

    const P = (u, v, w) => [bx + ca * u + nx * side * v * L + ca * w, by + sa * u + ny * side * v * L + sa * w];
    const pts = [P(0.95, 0, 0), P(0.95, 0.5, w1), P(0.9, 1, w2), P(0, 1, w2), P(0, 0.5, w1), P(0, 0, 0)];

    c.fillStyle = 'rgba(0,0,0,0.18)'; c.beginPath(); c.moveTo(...P(0.45, 0, 0)); c.quadraticCurveTo(...P(0.45, 0.5, w1), ...P(0.45, 1, w2)); c.lineTo(...P(0, 1, w2)); c.quadraticCurveTo(...P(0, 0.5, w1), ...P(0, 0, 0)); c.closePath(); c.fill();

// 함교 날개 위의 신호장교: 신호에 따라 패들을 든다 (작게)
function lsoSmall(c) {
  const x = 160 + ISL_DX, y = DECK_Y + 12.65, sig = G.lso, t = G.t, PI = Math.PI;
  let L = PI * 1.42, R = -PI * 0.42;   // 신호가 없을 때는 팔을 내린다
  if (sig === 'ROGER') { L = PI; R = 0; }
  else if (sig === 'HIGH') { L = PI * 0.75; R = PI * 0.25; }
  else if (sig === 'LOW' || sig === 'UNDER') { L = PI * 1.25; R = -PI * 0.25 + (sig === 'UNDER' ? Math.sin(t * 10) * 0.3 : 0); }
  else if (sig === 'FAST') { L = PI * 1.4; R = -PI * 0.4 + Math.sin(t * 9) * 0.25; }
  c.save(); c.translate(x, y); c.scale(1.5, 1.5); c.translate(-x, -y);   // 눈에 띄게 1.5배
  deckCrew(c, x, y, R, L, 'paddle');
  c.restore();
}

function hint() {

  c.fillStyle = '#fff'; c.font = '700 13px system-ui,sans-serif'; c.textAlign = 'left'; c.fillText('Fuel', 104, 33);
  // 항모 방향
  if (p.mode === 'air') {
    const d = (ship.x + DECK_L / 2) - p.x, far = Math.abs(d) > W / cam.z * 0.6;
    if (far) { panel(250, 10, 100, 36); c.fillStyle = '#fff'; c.textAlign = 'center'; { const ct = (d < 0 ? '◀ ' : '') + 'Carrier ' + Math.round(Math.abs(d)) + 'm' + (d > 0 ? ' ▶' : ''); fitFont(c, ct, 14, '700', 92); c.fillText(ct, 300, 33); } }
  }
  // 성적판
  if (G.stickers.length) {
    panel(612, 10, 22 + G.stickers.length * 22, 36);
    const col = { green: '#59d37a', yellow: '#ffd23f', brown: '#a9793f', red: '#ff5a3c', barrier: '#8a94a0' };
    G.stickers.forEach((s, i) => { c.fillStyle = col[s]; c.beginPath(); c.arc(634 + i * 22, 28, 8, 0, 7); c.fill(); });
  }
  c.restore();
  // 방향 버튼
  c.fillStyle = 'rgba(8,20,34,0.3)'; c.beginPath(); c.arc(PAD_C.x, PAD_C.y, PAD_S / 2 - 6, 0, 7); c.fill();   // 십자 가운데
  for (const d of DPAD) {
    c.fillStyle = ctl[d.k] ? 'rgba(255,210,63,0.85)' : 'rgba(8,20,34,0.42)'; c.beginPath(); c.roundRect(d.x, d.y, d.w, d.h, 14); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = 2; c.stroke();
    c.fillStyle = ctl[d.k] ? '#111' : '#fff'; c.font = '800 34px system-ui,sans-serif'; c.textAlign = 'center'; c.fillText(d.label, d.x + d.w / 2, d.y + d.h / 2 + 12);
  }
  for (const b of BTN) {
    c.fillStyle = 'rgba(26,60,110,0.85)'; c.beginPath(); c.roundRect(b.x, b.y, b.w, b.h, 9); c.fill();
    c.fillStyle = '#fff'; c.font = '800 13px system-ui,sans-serif'; c.textAlign = 'center';
    { const lb = b.id === 'snd' ? (sound.muted ? 'Sound off' : 'Sound on') : b.label; fitFont(c, lb, 13, '800', b.w - 8); c.fillText(lb, b.x + b.w / 2, b.y + b.h / 2 + 5); }
  }
  if (overElev()) {   // 엘리베이터 버튼
    const b = ELEV_BTN; c.fillStyle = 'rgba(26,90,150,0.92)'; c.beginPath(); c.roundRect(b.x, b.y, b.w, b.h, 12); c.fill(); c.strokeStyle = '#9fd0ff'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#fff'; c.font = '800 17px system-ui,sans-serif'; c.textAlign = 'center'; c.fillText('Elevator down (Space)', b.x + b.w / 2, b.y + 34);
  }
  G.toastH = 0;
  if (G.toast && G.t < G.toast.until) {   // 착함 결과
    const col = { green: '#59d37a', yellow: '#ffd23f', brown: '#a9793f' }[G.toast.grade] || '#fff';
    // 긴 글은 두 줄로 나눈다
    let L = [G.toast.text]; c.font = '800 16px system-ui,sans-serif';
    if (c.measureText(G.toast.text).width > MSG_W - 70) { const t = G.toast.text, mid = t.length / 2; let k = -1; for (let i = 0; i < t.length; i++) if (t[i] === ' ' && (k < 0 || Math.abs(i - mid) < Math.abs(k - mid))) k = i; if (k > 0) L = [t.slice(0, k), t.slice(k + 1)]; }
    const tw = Math.max(...L.map(l => fitFont(c, l, 16, '800', MSG_W - 70))), lh = 21, ph = 12 + L.length * lh;
    panel(MSG_CX - tw / 2 - 34, 138, tw + 68, ph, 0.8); c.fillStyle = col; c.beginPath(); c.arc(MSG_CX - tw / 2 - 14, 138 + ph / 2, 8, 0, 7); c.fill();
    c.fillStyle = '#fff'; c.textAlign = 'center'; L.forEach((l, i) => c.fillText(l, MSG_CX + 8, 159 + i * lh)); G.toastH = ph;
  }
  if (landBtnOn()) { const b = LANDBTN; c.fillStyle = 'rgba(40,120,70,0.94)'; c.beginPath(); c.roundRect(b.x, b.y, b.w, b.h, 12); c.fill(); c.strokeStyle = '#9ef0b8'; c.lineWidth = 2; c.stroke(); c.fillStyle = '#fff'; c.font = '800 17px system-ui,sans-serif'; c.textAlign = 'center'; c.fillText('Start landing (V)', b.x + b.w / 2, b.y + 32); }
  if (p.mode === 'air') fireBtns().forEach(b => {   // 발사 버튼
    const n = b.k === 'gun' ? p.ammo.gun : b.k === 'rocket' ? p.ammo.rk : b.k === 'torp' ? (p.ammo.tp || 0) : p.ammo.bm, held = b.k === 'gun' && (keys.Space || keys.KeyZ || touch.on.gun > 0);
    c.fillStyle = held ? 'rgba(230,90,60,0.9)' : n > 0 ? 'rgba(150,40,30,0.62)' : 'rgba(60,66,76,0.55)'; c.strokeStyle = 'rgba(255,255,255,0.45)'; c.lineWidth = 2; c.beginPath(); c.roundRect(b.x, b.y, b.w, b.h, 12); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.font = '800 15px system-ui,sans-serif'; c.fillText(b.label, b.x + b.w / 2, b.y + 26); c.font = '600 12px system-ui,sans-serif'; c.fillText(n + '  (' + b.key + ')', b.x + b.w / 2, b.y + 46);
  });
  if (G.tick && G.tick.length) {   // 뉴스 자막처럼: 왼쪽에 빨간 '속보' 꼬리표, 흰 글씨, 부드럽게 나타났다 사라진다
    const T = G.tick[0], el = T.t0 === undefined ? 0 : G.t - T.t0, al = clamp(Math.min(el / 0.4, (6 - el) / 0.5), 0, 1), by = (G.toastH ? 146 + G.toastH : 160) + (1 - clamp(el / 0.4, 0, 1)) * 30;
    c.globalAlpha = al; const tw = fitFont(c, T.text, 19, '700', MSG_W - 140), fs19 = c.font, bw = tw + 140, bx = MSG_CX - bw / 2;
    c.fillStyle = 'rgba(12,22,38,0.9)'; c.fillRect(bx, by, bw, 40); c.fillStyle = '#c62828'; c.fillRect(bx, by, 76, 40);
    c.fillStyle = '#fff'; c.font = '800 17px system-ui,sans-serif'; c.textAlign = 'center'; c.fillText('NEWS', bx + 38, by + 26);
    c.textAlign = 'left'; c.font = fs19; c.fillText(T.text, bx + 96, by + 27);
    c.fillStyle = 'rgba(255,255,255,0.25)'; c.fillRect(bx, by + 38, bw, 2); c.globalAlpha = 1;
  }
  if (hangarOpen()) drawPick(c);
  if (G.paused && G.scene === 'play' && !G.quiet) {   // 일시정지 화면 (G.quiet: 시험용으로 화면 표시 없이 멈춤)
    c.fillStyle = 'rgba(6,14,26,0.55)'; c.fillRect(-10, -40, W + 20, H + 60);
    c.textAlign = 'center'; c.fillStyle = '#fff'; c.font = '900 40px system-ui,sans-serif'; c.fillText(G.askQuit ? 'Leave this operation?' : 'Paused', 480, 250);
    c.font = '700 17px system-ui,sans-serif'; c.fillText(G.askQuit ? 'Tap Ops again (or press Esc) to leave · tap anywhere else to keep flying' : 'Tap the screen or press any key to continue', 480, 290);
    if (G.askQuit) { const b = BTN[0]; c.strokeStyle = '#ffd23f'; c.lineWidth = 3; c.beginPath(); c.roundRect(b.x - 3, b.y - 3, b.w + 6, b.h + 6, 11); c.stroke(); }
    c.textAlign = 'left';
  }
  const hm = G.paused ? '' : hint();
  if (hm) { const tw = fitFont(c, hm, 16, '700', MSG_W - 30); panel(MSG_CX - tw / 2 - 14, 96, tw + 28, 34, 0.7); c.fillStyle = '#fff'; c.textAlign = 'center'; c.fillText(hm, MSG_CX, 119); }
  // 결과
  if (G.result && ((G.result.kind !== 'crash' && G.result.kind !== 'wreck') || G.t - G.result.at > 2.6)) {
    const r = G.result; panel(250, 150, 460, 250, 0.86); c.textAlign = 'center';
    const col = { green: '#59d37a', yellow: '#ffd23f', brown: '#a9793f', red: '#ff5a3c', barrier: '#8a94a0' };
    const name = { green: 'Perfect', yellow: 'Good', brown: 'Fair', red: 'Danger', barrier: 'Barrier' };
    if (r.kind === 'land') {
      c.fillStyle = col[r.grade]; c.beginPath(); c.arc(480, 215, 38, 0, 7); c.fill();
      c.fillStyle = '#111'; c.font = '800 20px system-ui,sans-serif'; c.fillText(name[r.grade], 480, 222);
      c.fillStyle = '#fff'; c.font = '700 18px system-ui,sans-serif'; c.fillText(r.note, 480, 290);
      c.font = '600 14px system-ui,sans-serif'; c.fillStyle = '#c9d4de'; c.fillText('Touchdown ' + r.kt + ' kt', 480, 318);
    } else {
      c.fillStyle = '#fff'; c.font = '800 26px system-ui,sans-serif'; c.fillText(r.kind === 'ditch' ? 'Ditched' : 'Crashed', 480, 225);
      c.font = '700 16px system-ui,sans-serif'; c.fillText(r.why, 480, 282);
    }
    c.fillStyle = '#ffd23f'; c.font = '800 16px system-ui,sans-serif'; c.fillText(G.lives > 0 ? 'Tap here to fly again (Enter) · Planes left ' + G.lives : 'All aircraft lost (Enter)', 480, 368);
  }
}

const ZOOM_MIN = 0.6;   // 가장 많이 축소했을 때 (화면에 약 1.6km 폭)
function updateCam(dt) {
  const xr = p.x - ship.x, near = Math.abs(xr - DECK_L / 2) < APP_R + 400 && p.y < 260;
  let zt = p.mode === 'deck' || p.mode === 'taxi' || p.mode === 'lift' || (p.mode === 'down' && !G.result.sea) ? 2.9 : near ? 2.1 : 1.6;
  zt = Math.max(ZOOM_MIN, Math.min(zt, 0.5 * H / Math.max(p.y, 40)));   // 높이 올라가면 바다가 보이도록 축소하되, 너무 작아지지 않게 한계를 둔다
  cam.z = lerp(cam.z, zt, Math.min(1, dt * (zt < cam.z ? 6 : 1.5)));
  const dir = p.vx >= 0 ? 1 : -1;
  const tx = p.x + dir * (0.2 + clamp((kts() - 120) / 900, 0, 0.12)) * W / cam.z, ty = Math.max(p.y * 0.92, H * 0.27 / cam.z);
  cam.x = lerp(cam.x, tx, Math.min(1, dt * 5)); cam.y = lerp(cam.y, ty, Math.min(1, dt * 6)); cam.y = Math.min(cam.y, Math.max(0.4 * H / cam.z, p.y - 0.3 * H / cam.z));   // 바다가 화면 밖으로 나가지 않게 (아주 높으면 비행기를 따라간다)
}

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();
document.addEventListener('visibilitychange', () => { if (document.hidden && G.scene === 'play' && !G.paused) { G.paused = true; G.askQuit = false; for (const k in keys) keys[k] = false; } });   // 다른 앱으로 가면 저절로 멈춘다

let last = 0, acc = 0;
const STEP = 1 / 120;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  if (!G.paused) {
    readKeys(dt); acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    updateCam(dt);
  }
  updateSound(dt);
  const shake = p.mode === 'deck' && !p.landing && p.thr > 0.7 ? 1.6 : 0;
  ctx.save(); if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawWorld(); ctx.restore(); if (G.scene === 'play') drawHUD(); else drawScene();
  requestAnimationFrame(frame);
}
reset(); startDemo(); cam.x = p.x; cam.y = 60;
requestAnimationFrame(frame);
// 오프라인에서도 열리게 (실제 사이트에서만 등록한다)
if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator && typeof location !== 'undefined' && location.protocol === 'https:' && window.top === window) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
