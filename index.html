<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0b1622">
<title>헬캣 착함 대작전 — 1단계 시제품</title>
<style>
  html,body{margin:0;height:100%;background:#0b1622;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#8fc4e8}
  #rot{display:none;position:fixed;inset:0;background:#0b1622;color:#fff;font:600 20px system-ui,sans-serif;align-items:center;justify-content:center;text-align:center;z-index:5}
  @media (orientation:portrait) and (max-width:700px){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="rot">폰을 가로로 돌려 주세요</div>
<script>
'use strict';
// ───────── 상수 (단위: m, m/s) ─────────
const W = 960, H = 540, KT = 1.944;
const GRAV = 9.8, KL = 0.004375, KD0 = 0.000172, KDG = 0.00015, KDF = 0.00025, AMAX = 7.2, PWR = 850;
const SHIP_V = 15.4;                 // 갑판 맞바람 30노트
const DECK_Y = 20, DECK_L = 260, WH = 3.2;   // 갑판 높이, 길이, 바퀴 밑까지 거리
const ZONE_L = DECK_L * 0.3, ZONE_A = (DECK_L - ZONE_L) / 2, ZONE_B = ZONE_A + ZONE_L;   // 어레스팅 와이어 구역 (갑판의 30%, 가운데)
const WIRES = [0, 1, 2, 3].map(i => ZONE_A + 10 + i * (ZONE_L - 20) / 3);
const HOOK_BACK = 7.5, CRUISE_KT = 215, SLOW_KT = 92;   // 후크 끝 위치, 손을 뗐을 때 순항 속도, 항모 근처 접근 속도
const TAKEOFF_KT = 90, TURN_KT = 80;   // 이륙과 선회에 필요한 최소 속도
const LAND_KT = 118, LAND_SINK = 8, LAND_PITCH = 0.22;   // 착함 허용 한계: 속도, 가라앉는 속도, 기울기
const TD = 53, SLOPE = 0.065, CUT_X = -4;    // 접지 목표, 활공 기울기, 컷 신호 위치
const START_XR = 122, UTURN_XR = -650;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ───────── 상태 ─────────
const ship = { x: 0, v: SHIP_V };
const cam = { x: 0, y: 60, z: 3 };
const G = { t: 0, stickers: [], result: null, assist: true, lso: null, lsoT: 0, flag: 0 };
let p;
function reset() {
  p = { mode: 'deck', x: 0, y: DECK_Y + WH, vx: SHIP_V, vy: 0, th: 0, a: 0.035, s: 1, in: 0, thr: 0,
        gear: true, flaps: true, hook: false, fuel: 100, xr: START_XR, vr: 0, held: true, flagT: 0,
        landing: false, wire: -1, turn: 0, go: false, off: false, liftT: 0, wx: null, eng: false, ld: 1, relT: 0, engT: 0, tookOff: false, prevY: DECK_Y + WH,
        ap: { maxErr: 0, maxSpd: 0, on: false }, td: null };
  p.x = ship.x + p.xr;
  G.result = null; G.lso = null; G.msg = null; G.burn = null; FX.length = 0;
}
const kts = () => Math.hypot(p.vx, p.vy) * KT;

// ───────── 비행 물리 ─────────
function aero(V, alpha) {
  let CL = 5 * alpha + p.s * (0.25 + (p.flaps ? 0.5 : 0));
  const m = p.flaps ? 1.9 : 1.4; CL = clamp(CL, -m, m);
  const q = KL * V * V;
  const kd = KD0 + (p.gear ? KDG : 0) + (p.flaps ? KDF : 0);
  const thr = p.fuel > 0 ? p.thr : 0;
  return { aL: q * CL, aD: kd * V * V + q * CL * CL * 0.06, aT: thr * Math.min(AMAX, PWR / Math.max(V, 1)) };
}
function stallKt() { return Math.sqrt(GRAV / (KL * (p.flaps ? 1.9 : 1.4))) * KT; }

function airStep(dt) {
  p.prevY = p.y;
  let V = Math.hypot(p.vx, p.vy) || 0.01;
  if (p.off) {                            // 갑판에서 떨어지는 중: 조종 불가
    p.vy -= 11 * dt; p.vx *= 1 - 0.4 * dt; p.th += -p.s * 0.9 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; return;
  }
  if (p.turn > 0) {                       // 선회: 출력이 줄어 속도와 고도를 조금 잃는다
    p.turn -= dt;
    const f = clamp(1 - p.turn / 2.2, 0, 1);
    p.vx = p.v0 * Math.cos(Math.PI * f) * lerp(1, 0.85, f);
    p.vy += (-6 - p.vy) * Math.min(1, 2.5 * dt);
    if (f >= 0.5 && !p.flipped) { p.s = -p.s; p.a = -p.a; p.flipped = true; }
    p.th = p.s > 0 ? -0.06 : Math.PI + 0.06;
    if (p.turn <= 0) { p.vx = -p.v0 * 0.85; p.turn = 0; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    return;
  }
  const g = Math.atan2(p.vy, p.vx);
  if (p.s * Math.cos(g) < -0.3 && Math.abs(p.in) < 0.2) { p.s = -p.s; p.a = -p.a; }   // 뒤집힌 채 놓으면 바로 선다
  const aCmd = p.s * (0.035 + p.in * (p.in > 0 ? 0.15 : 0.1));
  p.a += (aCmd - p.a) * Math.min(1, dt * 16);
  p.th = g + p.a;
  const f = aero(V, p.a), ux = p.vx / V, uy = p.vy / V;
  p.vx += (f.aT * Math.cos(p.th) - f.aD * ux - f.aL * uy) * dt;
  p.vy += (f.aT * Math.sin(p.th) - f.aD * uy + f.aL * ux - GRAV) * dt;
  if (p.neutral) {   // 손을 뗀 상태: 흔들림 없이 천천히 내려가고 속도도 안정된다
    const xr = p.x - ship.x, over = xr > 0 && xr < DECK_L && p.y - WH - DECK_Y < 22;   // 갑판 위에 들어서면 조금 더 빨리 내려앉는다
    p.vy += ((over ? -5 : -2.5) - p.vy) * Math.min(1, (over ? 3 : 1.6) * dt);
    const Vt = (p.gear ? SLOW_KT : CRUISE_KT) / KT;
    p.vx += Math.sign(p.vx) * clamp((Vt - V) * 0.8, -7, 5) * dt;
  }
  p.x += p.vx * dt; p.y += p.vy * dt;
}
// 수평선에 대한 기수 각도 (어느 쪽을 보고 날든 같은 기준)
function levelPitch() { const a = p.s > 0 ? p.th : Math.PI - p.th; return Math.atan2(Math.sin(a), Math.cos(a)); }

function tailSit(V) { return 0.2 * clamp(1 - (V * KT - 34) / 30, 0, 1); }   // 느릴 때는 꼬리바퀴로 앉고, 빨라지면 꼬리가 들린다
function deckStep(dt) {
  if (p.landing) {                        // 착함 뒤: 후크가 와이어를 잡아 급히 멈춘다 (어느 방향이든)
    const d = p.ld, hookX = p.xr - d * HOOK_BACK;
    if (!p.eng && p.wx !== null && (hookX - p.wx) * d >= 0) {   // 후크가 와이어를 걸었다
      p.eng = true; p.engT = G.t; sfx('wire');
      for (let i = 0; i < 16; i++) FX.push({ k: 'spark', x: ship.x + hookX, y: DECK_Y + 0.4, vx: ship.v - d * (4 + Math.random() * 16), vy: 4 + Math.random() * 11, life: 0.35 + Math.random() * 0.35, t: 0 });
    }
    let dec;
    if (p.wx === null) dec = 6;   // 걸 와이어가 없다: 바퀴 제동뿐이라 갑판 끝에서 떨어지기 쉽다
    else if (p.eng) {   // 와이어가 걸렸다: 남은 갑판 안에서 세워 준다
      const room = (d > 0 ? DECK_L - p.xr : p.xr) - 8;
      dec = Math.max(34, p.vr * p.vr / (2 * clamp(room, 6, 40)));
    } else dec = Math.min(5, p.vr * p.vr / (2 * ((p.wx - hookX) * d + 4)));   // 와이어에 닿기 전: 바퀴만 굴러간다
    p.vr -= d * dec * dt; if (p.vr * d <= 0) p.vr = 0;
    p.xr += p.vr * dt;
    const tail = tailSit(Math.abs(p.vr + ship.v));
    p.th = p.s > 0 ? tail : Math.PI - tail;
    p.x = ship.x + p.xr; p.y = DECK_Y + WH; p.vx = p.vr + ship.v; p.vy = 0;
    if (p.xr < -3 || p.xr > DECK_L + 3) { p.mode = 'air'; p.landing = false; p.vy = -3; p.off = true; p.offWhy = p.wx === null ? '와이어 구역을 지나쳐 갑판 끝에서 떨어졌다. 노란 줄무늬 구역 앞쪽에 내려야 한다.' : '갑판이 모자라 바다로 떨어졌다. 갑판 가운데쯤에 내려야 한다.'; return; }   // 갑판이 모자라 떨어진다
    if (p.vr === 0) finish();
    return;
  }
  const V = p.vr + ship.v;
  if (p.held) {
    p.vr = 0; p.th = tailSit(ship.v);
    if (p.thr > 0.8) { p.flagT += dt; if (p.flagT > 0.8) { p.held = false; sfx('flag'); } } else p.flagT = 0;
  } else {
    const alpha = 0.035 + Math.max(0, p.in) * 0.19;
    const f = aero(V, alpha);
    let acc = f.aT * 1.55 - f.aD - 0.4;
    if (p.thr < 0.1) acc -= 4;
    p.vr = Math.max(0, p.vr + acc * dt);
    p.th = tailSit(V) + Math.max(0, p.in) * 0.12;
    if (V * KT >= TAKEOFF_KT && p.in > 0.3) {   // 속도가 붙은 뒤 기수를 들어야 뜬다
      p.mode = 'air'; p.vx = V; p.vy = 0.6; p.a = alpha; p.tookOff = true; p.liftT = G.t;
      p.y = DECK_Y + WH + 0.05; p.x = ship.x + p.xr; return;
    }
  }
  p.xr += p.vr * dt;
  p.x = ship.x + p.xr; p.y = DECK_Y + WH; p.vx = p.vr + ship.v; p.vy = 0;
  if (p.xr > DECK_L + 1) { p.mode = 'air'; p.a = 0.035; p.vy = -2; p.off = true; p.offWhy = '이륙 속도가 모자라 갑판 끝에서 떨어졌다.'; }
}

// ───────── 신호장교: 갑판에 다가올 때 속도·강하·수평을 알려 준다 ─────────
function lsoSignal() {
  if (p.mode !== 'air' || p.turn > 0 || !p.tookOff) return null;
  const xr = p.x - ship.x;
  if (xr < -520 || xr > DECK_L + 520 || p.y > DECK_Y + WH + 80 || p.vy > 0.5) return null;
  if (!((p.vx > 0 && xr < DECK_L) || (p.vx < 0 && xr > 0))) return null;
  if (kts() > LAND_KT * 0.94) return 'FAST';
  if (p.vy < -LAND_SINK * 0.75) return 'LOW';
  if (Math.abs(levelPitch()) > LAND_PITCH * 0.75) return 'HIGH';
  return 'ROGER';
}
const LSO_TEXT = { ROGER: '좋음 — 그대로', FAST: '빠름 — 손을 뗀다', LOW: '너무 급하다 — ▲', HIGH: '수평을 맞춘다' };

// ───────── 접지, 충돌, 판정 ─────────
function crash(why, ditch) {
  sfx(ditch ? 'splash' : 'crash'); p.mode = 'down';
  const sea = p.y <= 3;
  G.result = { kind: ditch ? 'ditch' : 'crash', why, at: G.t, sea };
  if (!ditch) boom(p.x, Math.max(p.y, 1), p.vx, p.vy, sea);
}
// 파편, 불꽃, 연기
const FX = [];
function boom(x, y, vx, vy, sea) {
  ['wing', 'wing', 'tail', 'cowl', 'body', 'body', 'wheel', 'wheel', 'bit', 'bit', 'bit', 'bit', 'bit'].forEach(k => FX.push({ k, deb: true, x, y: y + 1,
    vx: vx * 0.45 + (Math.random() - 0.5) * 34, vy: 7 + Math.random() * 17, r: Math.random() * 6, vr: (Math.random() - 0.5) * 14, life: 9, t: 0 }));
  for (let i = 0; i < 18; i++) FX.push({ k: 'fire', x: x + (Math.random() - 0.5) * 9, y: y + Math.random() * 3, vx: vx * 0.3 + (Math.random() - 0.5) * 14, vy: 3 + Math.random() * 12, life: 0.7 + Math.random() * 1.0, t: 0, s: 2 + Math.random() * 3.5 });
  FX.push({ k: 'flash', x, y, vx: 0, vy: 0, life: 0.28, t: 0 });
  G.burn = sea ? null : { xr: x - ship.x, y, until: G.t + 7, next: 0 };
}
function stepFx(dt) {
  if (G.burn && G.t < G.burn.until && G.t >= G.burn.next) {   // 잔해에서 연기와 불이 계속 오른다
    G.burn.next = G.t + 0.07; const bx = ship.x + G.burn.xr + (Math.random() - 0.5) * 6;
    FX.push({ k: Math.random() < 0.35 ? 'fire' : 'smoke', x: bx, y: G.burn.y + Math.random() * 2, vx: ship.v - 4 + Math.random() * 3, vy: 5 + Math.random() * 5, life: 1.4 + Math.random(), t: 0, s: 2 + Math.random() * 3 });
  }
  for (let i = FX.length - 1; i >= 0; i--) {
    const q = FX[i]; q.t += dt; q.life -= dt;
    if (q.deb) {
      if (!q.rest) {
        q.vy -= GRAV * 1.3 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.r += q.vr * dt;
        const xr = q.x - ship.x;
        if (xr > -2 && xr < DECK_L + 2 && q.y <= DECK_Y + 0.6 && q.y > DECK_Y - 4 && q.vy < 0) {   // 갑판에 튕긴다
          q.y = DECK_Y + 0.6; q.vy = -q.vy * 0.35; q.vx = ship.v + (q.vx - ship.v) * 0.55; q.vr *= 0.5;
          if (q.vy < 2) { q.rest = true; q.xr = xr; }
        } else if (q.y <= 0) { q.life = 0; FX.push({ k: 'splash', x: q.x, y: 0, vx: 0, vy: 0, life: 0.6, t: 0 }); }
      } else q.x = ship.x + q.xr;
    } else { if (q.k === 'spark') q.vy -= 32 * dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.k !== 'spark') q.vx += (ship.v * 0.3 - q.vx) * dt; }
    if (q.life <= 0) FX.splice(i, 1);
  }
}
function drawFx() {
  const c = ctx;
  for (const q of FX) {
    if (q.deb) { world(q.x, q.y, () => {
      c.rotate(q.r);
      if (q.k === 'wing') { c.fillStyle = '#27466a'; c.beginPath(); c.moveTo(-5, -0.5); c.lineTo(5, -0.3); c.lineTo(4, 0.5); c.lineTo(-4.2, 0.9); c.closePath(); c.fill(); c.fillStyle = '#f4f6f8'; c.beginPath(); c.arc(1, 0.1, 0.5, 0, 7); c.fill(); }
      else if (q.k === 'tail') { c.fillStyle = '#24405f'; c.beginPath(); c.moveTo(-1.5, -1.6); c.lineTo(2, -1.6); c.lineTo(-0.6, 2.4); c.lineTo(-1.6, 2.4); c.closePath(); c.fill(); }
      else if (q.k === 'cowl') { c.fillStyle = '#1d3552'; c.beginPath(); c.arc(0, 0, 2, 0, 7); c.fill(); c.fillStyle = '#333'; c.fillRect(-0.2, -3.2, 0.4, 6.4); }
      else if (q.k === 'body') { c.fillStyle = '#2f4f74'; c.beginPath(); c.moveTo(-3.4, -1.6); c.lineTo(2.6, -2); c.lineTo(3.6, 0.4); c.lineTo(1.8, 0); c.lineTo(2.8, 1.9); c.lineTo(-3, 1.5); c.closePath(); c.fill(); c.fillStyle = '#e9edf0'; c.fillRect(-3, -1.6, 5.4, 0.9); }
      else if (q.k === 'wheel') { c.fillStyle = '#222'; c.beginPath(); c.arc(0, 0, 0.75, 0, 7); c.fill(); }
      else { c.fillStyle = '#c9ced4'; c.fillRect(-0.6, -0.3, 1.2, 0.6); }
    }); continue; }
    const X = sx(q.x), Y = sy(q.y), k = clamp(q.t / (q.t + q.life), 0, 1);
    if (q.k === 'flash') { c.fillStyle = 'rgba(255,244,200,' + (1 - k) + ')'; c.beginPath(); c.arc(X, Y, (10 + k * 34) * cam.z, 0, 7); c.fill(); }
    else if (q.k === 'fire') { c.fillStyle = k < 0.35 ? 'rgba(255,225,90,0.95)' : k < 0.7 ? 'rgba(255,130,40,' + (0.9 - k * 0.3) + ')' : 'rgba(70,70,70,' + (1 - k) * 1.6 + ')'; c.beginPath(); c.arc(X, Y, q.s * (0.7 + k) * cam.z, 0, 7); c.fill(); }
    else if (q.k === 'smoke') { c.fillStyle = 'rgba(60,62,66,' + (0.55 * (1 - k)) + ')'; c.beginPath(); c.arc(X, Y, q.s * (0.8 + k * 1.6) * cam.z, 0, 7); c.fill(); }
    else if (q.k === 'spark') { c.fillStyle = 'rgba(255,238,160,' + (1 - k) + ')'; c.beginPath(); c.arc(X, Y, 0.45 * cam.z * (1 - 0.5 * k), 0, 7); c.fill(); }
    else if (q.k === 'splash') { c.fillStyle = 'rgba(255,255,255,' + (0.8 * (1 - k)) + ')'; c.beginPath(); c.ellipse(X, Y - 6 * k * cam.z, (2 + 3 * k) * cam.z, (1 + 5 * k) * cam.z, 0, 0, 7); c.fill(); }
  }
}
function checkContact() {
  const xr = p.x - ship.x, wheel = p.y - WH;
  if (p.y <= 2.2) {
    if (p.off) return crash(p.offWhy);
    const soft = Math.hypot(p.vx, p.vy) < 56 && p.vy > -6;
    return crash(soft ? '바다에 내려앉았다. 조종사는 구축함이 구조했다.' : '바다에 추락했다.', soft);
  }
  if (p.off) return;
  if (xr > -4 && xr < DECK_L + 4 && wheel < DECK_Y) {
    const wasAbove = p.prevY - WH >= DECK_Y - 0.6 && xr >= 0 && xr <= DECK_L;
    if (!wasAbove) return crash('선체에 부딪혔다. 너무 낮았다.');
    if (p.turn > 0) return crash('선회 중에 날개가 갑판에 부딪혔다. 선회하는 동안은 착함할 수 없다.');
    const kt = kts(), pitch = levelPitch();
    if (!p.gear || p.s * p.vx <= 0) return crash('바퀴가 아닌 곳으로 내렸다.');
    if (p.vy < -LAND_SINK) return crash('너무 세게 내려앉았다. 천천히 내려와야 한다.');
    if (kt > LAND_KT) return crash('너무 빨랐다. 손을 떼고 속도를 줄여야 한다.');
    if (Math.abs(pitch) > LAND_PITCH) return crash('수평이 아니었다. 기수를 너무 ' + (pitch > 0 ? '들었다.' : '숙였다.'));
    p.td = { kt, sink: -p.vy, pitch }; sfx('thump');
    p.ld = p.s > 0 ? 1 : -1; const hx0 = xr - p.ld * HOOK_BACK;   // 후크가 처음 닿을 와이어: 진행 방향 앞쪽 첫 번째
    p.wx = p.ld > 0 ? (WIRES.find(w => w >= hx0) ?? null) : ([...WIRES].reverse().find(w => w <= hx0) ?? null);
    p.eng = false; p.relT = 0;
    p.mode = 'deck'; p.landing = true; p.held = false; p.xr = xr; p.vr = p.vx - ship.v; p.vy = 0; p.y = DECK_Y + WH;
  }
}
function finish() {
  const td = p.td;
  let grade, note;
  const wn = p.wx === null ? 0 : (p.ld > 0 ? WIRES.indexOf(p.wx) + 1 : WIRES.length - WIRES.indexOf(p.wx));
  if (wn === 0) { grade = 'brown'; note = '와이어 없이 바퀴 제동만으로 멈췄다.'; }
  else if (td.sink < 5.6 && td.kt < 105 && Math.abs(td.pitch) < 0.12) { grade = 'green'; note = wn + '번 와이어. 부드럽고 반듯하게 내렸다. 완벽하다!'; }
  else if (td.sink < 7) { grade = 'yellow'; note = td.kt >= 105 ? '조금 빨랐다.' : Math.abs(td.pitch) >= 0.12 ? '조금 기울었다.' : '조금 세게 내렸다.'; }

    for (let x = ZONE_A; x + 3.2 <= ZONE_B; x += 4) { c.beginPath(); c.moveTo(x, DECK_Y - 1.6); c.lineTo(x + 2, DECK_Y - 1.6); c.lineTo(x + 3.2, DECK_Y); c.lineTo(x + 1.2, DECK_Y); c.closePath(); c.fill(); }
    [ZONE_A, ZONE_B].forEach((x, i) => { c.fillStyle = '#f2b705'; c.fillRect(x - 0.35, DECK_Y, 0.7, 3.4); c.beginPath(); c.moveTo(x, DECK_Y + 3.4); c.lineTo(x + (i ? -2.6 : 2.6), DECK_Y + 2.6); c.lineTo(x, DECK_Y + 1.8); c.closePath(); c.fill(); });   // 경계 표지

    WIRES.forEach(w => { if (pulled && w === p.wx) return; c.beginPath(); c.moveTo(w - 0.8, DECK_Y); c.quadraticCurveTo(w, DECK_Y + 1.3, w + 0.8, DECK_Y); c.stroke(); });
    if (pulled) {

      let ex = hx, sag = 0;

      c.strokeStyle = '#ffd23f'; c.lineWidth = 0.7; c.beginPath(); c.moveTo(p.wx, ay); c.quadraticCurveTo(mx, (ay + ey) / 2 + sag, ex, ey); c.stroke();

    }

    c.fillStyle = '#e8ecf0'; c.fillRect(9.4, DECK_Y, 0.9, 2.2); c.fillStyle = '#f2c9a0'; c.beginPath(); c.arc(9.85, DECK_Y + 2.8, 0.6, 0, 7); c.fill();
    c.fillStyle = '#ff5a3c'; c.fillRect(7.6, DECK_Y + 1.6, 1.3, 1.0); c.fillRect(10.8, DECK_Y + 1.6, 1.3, 1.0);

      c.save(); c.translate(fx + 0.9, DECK_Y + 1.8); c.rotate(dn ? -0.5 : 1.1 + Math.sin(G.t * 14) * (p.thr > 0.8 ? 0.3 : 0));
      c.strokeStyle = '#333'; c.lineWidth = 0.18; c.beginPath(); c.moveTo(0, 0); c.lineTo(3, 0); c.stroke();
      for (let i = 0; i < 4; i++) { c.fillStyle = i % 2 ? '#111' : '#fff'; c.fillRect(1.4 + (i % 2) * 0.8, i < 2 ? 0 : 0.8, 0.8, 0.8); }

}

function drawGuide() {   // 접근 안내선과 U턴 지점

  c.beginPath(); c.moveTo(sx(ship.x + TD), sy(idealY(TD))); c.lineTo(sx(ship.x + UTURN_XR), sy(idealY(UTURN_XR))); c.stroke(); c.setLineDash([]);

function drawWorld() {
  const c = ctx, seaY = sy(0);
  const sky = c.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#4f9ad6'); sky.addColorStop(1, '#bfe4f5');
  c.fillStyle = sky; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(255,255,255,0.85)';   // 구름
  for (let i = 0; i < 14; i++) {
    const wx = i * 900 + (i * 373) % 500, wy = 260 + (i * 197) % 520;
    let X = ((wx - cam.x * 0.6) * cam.z * 0.6 + W / 2) % (W + 400); if (X < -200) X += W + 400;
    const Y = H / 2 - (wy - cam.y) * cam.z * 0.6;
    c.beginPath(); c.ellipse(X, Y, 70, 20, 0, 0, 7); c.ellipse(X + 40, Y - 14, 44, 18, 0, 0, 7); c.ellipse(X - 42, Y - 8, 36, 14, 0, 0, 7); c.fill();
  }
  const sea = c.createLinearGradient(0, seaY, 0, H); sea.addColorStop(0, '#1f8fa8'); sea.addColorStop(1, '#0e4f73');
  c.fillStyle = sea; c.fillRect(0, seaY, W, Math.max(0, H - seaY));
  c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 2;   // 물결
  const span = W / cam.z, x0 = Math.floor((cam.x - span / 2) / 45) * 45;
  for (let x = x0; x < cam.x + span / 2 + 45; x += 45) {
    const r = ((x / 45) % 5 + 5) % 5, X = sx(x), Y = seaY + 8 + r * 9;
    if (Y < H) { c.beginPath(); c.moveTo(X, Y); c.quadraticCurveTo(X + 9, Y - 4, X + 18, Y); c.stroke(); }
  }
  const sp = kts();
  if (p.mode === 'air' && sp > 110) {   // 빨라질수록 선명해지는 바람줄
    const ds = p.vx >= 0 ? 1 : -1, al = clamp((sp - 110) / 120, 0, 0.34), L = Math.hypot(p.vx, p.vy) * 0.14 * cam.z, spanY = H / cam.z, i0 = Math.floor((cam.x - span / 2) / 53);
    c.strokeStyle = 'rgba(255,255,255,' + al + ')'; c.lineWidth = 2; c.lineCap = 'round';
    for (let i = i0; i < i0 + span / 53 + 3; i++) {
      const hh = Math.abs((Math.sin(i * 12.9898) * 43758.5453) % 1), wy = cam.y + (hh - 0.5) * spanY * 0.9;
      if (wy < 8) continue;
      const X = sx(i * 53 + hh * 40), Y = sy(wy);
      c.beginPath(); c.moveTo(X, Y); c.lineTo(X + ds * L, Y); c.stroke();
    }
    c.lineCap = 'butt';
  }
  drawShip();
  // 플레이어 기체
  if (p.mode !== 'down' || G.result.kind === 'ditch') {
    world(p.x, p.y, () => {
      if (p.turn > 0) {
        const f = clamp(1 - p.turn / 2.2, 0, 1);
        drawPlane3D((p.v0 > 0 ? 0 : Math.PI) + Math.PI * f, Math.sin(Math.PI * f) * 1.0, p.gear);
      } else {
        c.rotate(p.th); c.scale(1, p.s);
        drawPlane({ gear: p.gear, flaps: p.flaps, hook: p.hook, thr: p.fuel > 0 ? p.thr : 0 });
      }
    });
  }
  drawFx();
  if (p.mode === 'down' && G.result.sea) {   // 물기둥
    const X = sx(p.x), k = clamp((G.t - (G.result.t0 || (G.result.t0 = G.t))) * 2, 0, 1);
    c.fillStyle = 'rgba(255,255,255,' + (0.9 - 0.5 * k) + ')'; c.beginPath(); c.ellipse(X, sy(0) - 20 * k, 26 + 20 * k, 30 * k + 6, 0, 0, 7); c.fill();
  }
}

function panel(x, y, w, h, a) { ctx.fillStyle = 'rgba(8,20,34,' + (a || 0.55) + ')'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill(); }

function drawLSO() {   // 신호장교 확대창
  const sig = G.lso; if (!sig) return;
  const c = ctx, x = 720, y = 58, w = 226, h = 122, t = G.t;
  const warn = sig === 'WAVEOFF', good = sig === 'ROGER' || sig === 'CUT';
  panel(x, y, w, h, 0.72);
  c.strokeStyle = warn ? '#ff5a3c' : good ? '#59d37a' : '#ffd23f'; c.lineWidth = 3; c.beginPath(); c.roundRect(x, y, w, h, 10); c.stroke();
  const cx = x + 52, cy = y + 66;
  let L = Math.PI, R = 0;   // 팔 각도 (왼팔, 오른팔)
  if (sig === 'HIGH') { L = Math.PI * 0.75; R = Math.PI * 0.25; }
  if (sig === 'LOW') { L = Math.PI * 1.25; R = -Math.PI * 0.25; }
  if (sig === 'FAST') { L = Math.PI * 1.4; R = -Math.PI * 0.4 + Math.sin(t * 9) * 0.25; }
  if (sig === 'SLOW') { const k = Math.sin(t * 9) * 0.3; L = Math.PI + k; R = -k; }
  if (sig === 'CUT') { L = Math.PI * 1.3; R = Math.PI * 0.85; }
  if (sig === 'WAVEOFF') { const k = Math.sin(t * 12) * 0.5; L = Math.PI * 0.6 + k; R = Math.PI * 0.4 - k; }
  if (sig === 'GEAR' || sig === 'HOOK') { L = Math.PI * 1.2; R = Math.PI * 0.3 + Math.sin(t * 10) * 0.4; }
  c.fillStyle = '#f2f4f6'; c.beginPath(); c.roundRect(cx - 9, cy - 8, 18, 34, 5); c.fill();
  c.fillStyle = '#f2c9a0'; c.beginPath(); c.arc(cx, cy - 20, 10, 0, 7); c.fill();
  c.fillStyle = '#d9a441'; c.beginPath(); c.arc(cx, cy - 23, 10, Math.PI, 0); c.fill();
  [[L, -1], [R, 1]].forEach(([a, sd]) => {
    const ax = cx + sd * 8, ay = cy - 2, ex = ax + Math.cos(a) * 26, ey = ay - Math.sin(a) * 26;
    c.strokeStyle = '#f2f4f6'; c.lineWidth = 6; c.lineCap = 'round'; c.beginPath(); c.moveTo(ax, ay); c.lineTo(ex, ey); c.stroke();
    c.fillStyle = '#ff5a3c'; c.beginPath(); c.arc(ex, ey, 9, 0, 7); c.fill(); c.strokeStyle = '#ffd23f'; c.lineWidth = 2; c.stroke();
  });
  c.lineCap = 'butt';
  c.fillStyle = '#fff'; c.textAlign = 'left'; c.font = '700 12px system-ui,sans-serif'; c.fillText('신호장교', x + 108, y + 26);
  c.font = '800 17px system-ui,sans-serif'; c.fillStyle = warn ? '#ff8a73' : good ? '#8df0a8' : '#ffe27a';
  const parts = LSO_TEXT[sig].split(' — '); c.fillText(parts[0], x + 108, y + 58);
  if (parts[1]) { c.font = '600 13px system-ui,sans-serif'; c.fillStyle = '#fff'; c.fillText(parts[1], x + 108, y + 82); }
}

function hint() {
  if (G.result) return '';
  if (G.msg && G.t < G.msg.until) return G.msg.text;
  const xr = p.x - ship.x;
  if (p.mode === 'deck' && !p.landing) {
    if (!p.go) return '▶ 를 누르면 발진';
    if (p.held) return '발진 신호를 기다린다…';
    return kts() >= TAKEOFF_KT ? '▲ 기수를 든다!' : '달리는 중… ' + TAKEOFF_KT + '노트가 되면 ▲';
  }
  if (p.mode === 'deck') return '';
  if (p.turn > 0) return '선회 중 — 속도와 고도가 조금 줄어든다';
  if (G.lso) return '';
  if (G.t - p.liftT < 5) return '▲ 로 상승한다';
  if (Math.abs(xr - 130) > 900) return '반대 방향 키로 선회해 항모로 돌아간다';
  return '손을 떼면 천천히 내려간다. 노란 줄무늬 어레스팅 구역에 수평으로 내려앉는다';
}

function drawHUD() {
  const c = ctx, kt = p.turn > 0 ? Math.abs(p.v0) * KT : kts(), xr = p.x - ship.x;

  const stall = (p.mode === 'air') && kt < stallKt() * 1.04;
  c.fillStyle = stall ? '#ff8a73' : '#fff'; c.fillText(Math.round(kt) + ' 노트', 420, 39);
  c.fillStyle = '#fff'; c.fillText(Math.round(Math.max(0, p.y - WH)) + ' m', 540, 39);
  if (stall && Math.sin(G.t * 12) > 0) { c.fillStyle = '#ff5a3c'; c.font = '800 22px system-ui,sans-serif'; c.fillText('실속!', 480, 84); }
  // 연료
  panel(92, 10, 150, 36); c.fillStyle = '#243447'; c.fillRect(140, 22, 92, 12);
  c.fillStyle = p.fuel < 20 ? '#ff5a3c' : '#59d37a'; c.fillRect(140, 22, 92 * p.fuel / 100, 12);
  c.fillStyle = '#fff'; c.font = '700 13px system-ui,sans-serif'; c.textAlign = 'left'; c.fillText('연료', 104, 33);
  // 항모 방향

    if (far) { panel(250, 10, 100, 36); c.fillStyle = '#fff'; c.textAlign = 'center'; c.font = '700 14px system-ui,sans-serif'; c.fillText((d < 0 ? '◀ ' : '') + '항모 ' + Math.round(Math.abs(d)) + 'm' + (d > 0 ? ' ▶' : ''), 300, 33); }
  }
  // 성적판
  if (G.stickers.length) {

    const col = { green: '#59d37a', yellow: '#ffd23f', brown: '#a9793f', red: '#ff5a3c', barrier: '#8a94a0' };
    G.stickers.forEach((s, i) => { c.fillStyle = col[s]; c.beginPath(); c.arc(634 + i * 22, 28, 8, 0, 7); c.fill(); });
  }
  // 방향 버튼
  for (const d of DPAD) {
    c.fillStyle = ctl[d.k] ? 'rgba(255,210,63,0.85)' : 'rgba(8,20,34,0.42)'; c.beginPath(); c.roundRect(d.x, d.y, d.w, d.h, 14); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = 2; c.stroke();
    c.fillStyle = ctl[d.k] ? '#111' : '#fff'; c.font = '800 34px system-ui,sans-serif'; c.textAlign = 'center'; c.fillText(d.label, d.x + d.w / 2, d.y + d.h / 2 + 12);
  }

    c.fillStyle = 'rgba(26,60,110,0.85)'; c.beginPath(); c.roundRect(b.x, b.y, b.w, b.h, 9); c.fill();
    c.fillStyle = '#fff'; c.font = '800 13px system-ui,sans-serif'; c.textAlign = 'center';
    c.fillText(b.id === 'snd' ? (sound.muted ? '소리 끔' : '소리 켬') : b.label, b.x + b.w / 2, b.y + b.h / 2 + 5);
  }
  drawLSO();
  const hm = hint();
  if (hm) { c.font = '700 16px system-ui,sans-serif'; const tw = c.measureText(hm).width; panel(480 - tw / 2 - 14, 96, tw + 28, 34, 0.7); c.fillStyle = '#fff'; c.textAlign = 'center'; c.fillText(hm, 480, 119); }
  // 결과
  if (G.result && (G.result.kind !== 'crash' || G.t - G.result.at > 2.6)) {
    const r = G.result; panel(250, 150, 460, 250, 0.86); c.textAlign = 'center';
    const col = { green: '#59d37a', yellow: '#ffd23f', brown: '#a9793f', red: '#ff5a3c', barrier: '#8a94a0' };
    const name = { green: '완벽', yellow: '양호', brown: '미흡', red: '위험', barrier: '방벽' };
    if (r.kind === 'land') {
      c.fillStyle = col[r.grade]; c.beginPath(); c.arc(480, 215, 38, 0, 7); c.fill();
      c.fillStyle = '#111'; c.font = '800 20px system-ui,sans-serif'; c.fillText(name[r.grade], 480, 222);
      c.fillStyle = '#fff'; c.font = '700 18px system-ui,sans-serif'; c.fillText(r.note, 480, 290);
      c.font = '600 14px system-ui,sans-serif'; c.fillStyle = '#c9d4de'; c.fillText('접지 속도 ' + r.kt + '노트', 480, 318);
    } else {
      c.fillStyle = '#fff'; c.font = '800 26px system-ui,sans-serif'; c.fillText(r.kind === 'ditch' ? '불시착수' : '추락', 480, 225);
      c.font = '700 16px system-ui,sans-serif'; c.fillText(r.why, 480, 282);
    }
    c.fillStyle = '#ffd23f'; c.font = '800 16px system-ui,sans-serif'; c.fillText('여기를 누르면 다시 이륙 (Enter)', 480, 368);
  }
}

function updateCam(dt) {
  const xr = p.x - ship.x, near = Math.abs(xr - 130) < 900 && p.y < 260;
  const zt = p.mode === 'deck' || p.mode === 'done' || (p.mode === 'down' && !G.result.sea) ? 2.9 : near ? 2.1 : 1.45;
  cam.z = lerp(cam.z, zt, Math.min(1, dt * 1.5));
  const dir = p.vx >= 0 ? 1 : -1;
  const tx = p.x + dir * (0.2 + clamp((kts() - 120) / 900, 0, 0.12)) * W / cam.z, ty = Math.max(p.y * 0.92, H * 0.27 / cam.z);
  cam.x = lerp(cam.x, tx, Math.min(1, dt * 3)); cam.y = lerp(cam.y, ty, Math.min(1, dt * 4));
}

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

let last = 0, acc = 0;
const STEP = 1 / 120;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  if (!G.paused) {
    readKeys(dt); acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    updateCam(dt);
  }
  updateSound(dt);
  const shake = p.mode === 'deck' && !p.landing && p.thr > 0.7 ? 1.6 : 0;
  ctx.save(); if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawWorld(); ctx.restore(); drawHUD();
  requestAnimationFrame(frame);
}
reset(); cam.x = p.x; cam.y = 60;
requestAnimationFrame(frame);
</script>
</body>
</html>
